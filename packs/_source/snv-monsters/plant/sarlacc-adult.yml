      description:
        value: >-
          <p>The sarlacc releases pheromones in a 300-foot radius. Each creature in that area must make a DC 23
          Constitution saving throw. On a failed save the creature is charmed by the sarlacc for 1 minute. While charmed
          this way, the target tries to get as close to the sarlacc as possible, using its actions to Dash until it is
          within 5 feet of the sarlacc. A charmed target can repeat the saving throw at the end of each of its turns and
          whenever it takes damage, ending the effect on itself on a success. If a creature's saving throw is successful
          or the effect ends for it, the creature has advantage on saving throws against the sarlacc's Pheromones for 24
          hours.</p>
