            requiresGrappledTarget: true
            targetSizeMax: Large
            ongoingAcidFormula: null
            regurgitateDamageThreshold: 40
            regurgitateSaveDc: 23
            runtimeAutomation: false
            limitation: Swallow follow-up attack, containment, ongoing acid, and regurgitation are description-preserved only.
    img: modules/sw5e-module/icons/packs/monsters/245_-_Sarlacc_2C_Adult/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The sarlacc makes one bite attack against a Large or smaller creature it is grappling. If the attack hits,
          the target takes the bite's damage, the target is swallowed, and the grapple ends. While swallowed, the
          creature is blinded and restrained, it has total cover against attacks and other effects outside the sarlacc,
          and it takes 35 (10d6) psychic damage at the start of each of the sarlacc's turns. If the sarlacc takes 40
          damage or more on a single turn from a creature inside it, the sarlacc must succeed on a DC 23 Constitution
          saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in a space
          within 10 feet of the sarlacc. If the sarlacc dies, a swallowed creature is no longer restrained by it and can
          escape from the corpse by using 10 feet of movement, exiting prone.</p>
        chat: ""
      requirements: ""
