    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The skungus explodes in a burst of acid and thorns in a 20 foot radius. Every creature in the area must
          succeed on a DC 12 Dexterity saving throw or take 13 (3d8) kinetic damage and 13 (6d8) acid damage. The
          affected area is considered difficult terrain for 1 minute and is coated in acid. A creature that enters the
          area for the first time on a turn or starts its turn there takes 3 (1d6) acid damage. The explosion destroys
          the skungus' body.</p>
        chat: ""
