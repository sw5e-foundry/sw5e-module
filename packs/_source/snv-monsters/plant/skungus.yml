    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Any time the skungus is targeted by a ranged weapon attack, roll a d6. On a 1 to 5, the skungus is
          unaffected. On a 6, the skungus is unaffected, and the attack is reflected back at the attacker as though it
          originated from the skungus, turning the attacker into the target.</p>
