              Engulf movement-into-space save, restrained/blinded ongoing acid, and escape checks are
              description-preserved only.
    img: modules/sw5e-module/icons/packs/monsters/382_-_Mnggal-Mnggal_2C_Lake_of/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Mnggal-Mnggal moves up to its speed. While doing so, it can enter Gargantuan or smaller creatures’ spaces.
          Whenever Mnggal-Mnggal enters a creature’s space, the creature must make a DC 21 Dexterity saving throw. On a
          success, the creature can choose to be pushed 5 feet back or to the side of Mnggal-Mnggal. If it chooses not
          to be moved, it suffers the consequences of a failed saving throw. On a failure, the creature takes 21 (3d8 +
          8) kinetic damage and 7 (2d6) acid damage and is engulfed by Mnggal-Mnggal. An engulfed creature is blinded,
          restrained, can’t breathe, has total cover against attacks and other effects outside Mnggal-Mnggal, and takes
          21 (6d6) acid damage at the start of each of Mnggal-Mnggal's turns. An engulfed creature can try to escape by
          using its action to make a DC 25 Strength (Athletics) check. On a success, the creature escapes and enters a
          space of its choice within 5 feet of Mnggal-Mnggal. A creature within 5 feet of Mnggal-Mnggal can also attempt
          to pull an engulfed target free in the nearest unoccupied space as an action. Doing so requires a successful
          DC 25 Strength (Athletics) check, and the creature making the attempt takes 7 (2d6) acid damage. Mnggal-Mnggal
          can hold up to one Huge creature, two Large creatures, or up to eight Medium or smaller creatures inside it at
          a time. If a creature is reduced to 0 hit points, Mnggal-Mnggal can choose to either digest the creature,
          which kills it outright, or use its Infect Host action on the creature.</p>
