          complexActionLimitation:
            family: engulf
            featureName: Engulf
            saveAbility: dex
            saveDc: 14
            escapeDc: 17
            runtimeAutomation: false
            limitation: >-
              Engulf movement-into-space save, restrained/blinded ongoing acid, and escape checks are
              description-preserved only.
    img: modules/sw5e-module/icons/packs/monsters/380_-_Mnggal-Mnggal_2C_Gray_Pudding/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Mnggal-Mnggal moves up to its speed. While doing so, it can enter Huge or smaller creatures’ spaces.
          Whenever Mnggal-Mnggal enters a creature’s space, the creature must make a DC 14 Dexterity saving throw. On a
          success, the creature can choose to be pushed 5 feet back or to the side of Mnggal-Mnggal. If it chooses not
          to be moved, it then suffers the consequences of a failed saving throw. On a failure, the creature takes 12
          (2d6 + 5) kinetic damage and 7 (2d6) acid damage, and is engulfed by Mnggal-Mnggal. An engulfed creature is
          blinded, restrained, can’t breathe, has total cover against attacks and other effects outside Mnggal-Mnggal,
          and takes 7 (2d6) acid damage at the start of each of Mnggal-Mnggal's turns. An engulfed creature can try to
          escape by using its action to make a DC 17 Strength (Athletics) check. On a success, the creature escapes and
          enters a space of its choice within 5 feet of Mnggal-Mnggal. A creature within 5 feet of Mnggal-Mnggal can
          also attempt to pull an engulfed target free into the nearest unoccupied space as an action. Doing so requires
          a successful DC 17 Strength (Athletics) check, and the creature making the attempt takes 7 (2d6) acid damage.
          Mnggal-Mnggal can hold up to four Medium or smaller creatures inside it at a time. If a creature is reduced to
          0 hit points, Mnggal-Mnggal can choose to either digest the creature, which kills it outright, or use its
          Infect Host action on the creature.</p>
        chat: ""
      requirements: ""
