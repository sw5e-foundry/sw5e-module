    img: modules/sw5e-module/icons/packs/monsters/380_-_Mnggal-Mnggal_2C_Gray_Pudding/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Mnggal-Mnggal targets a creature grappled or engulfed by it, or an unconscious creature within 15 feet, and
          attempts to infect it with its ooze. A creature that is grappled or engulfed must make a DC 16 Constitution
          saving throw to keep the ooze out of their mouth. On a failed save, the creature becomes poisoned. A creature
          poisoned in this way takes 11 (2d10) poison damage at the start of its turn. This damage ignores resistance
          and immunity. A creature reduced to 0 hit points by this damage is killed instantly, and rises the next round
          as a Mnggal-Mnggal zombie. Creatures can repeat this saving throw at the end of their turn. A creature that
          has successfully saved is immune to this ability for 24 hours. Unconscious creatures make this save with
          disadvantage.</p>
