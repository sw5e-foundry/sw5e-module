            family: acid-spit-cone
            featureName: Acid Spit
            runtimeAutomation: false
            limitation: Complex save cone / possession-transform rider is description-preserved only.
    img: modules/sw5e-module/icons/packs/monsters/380_-_Mnggal-Mnggal_2C_Gray_Pudding/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Mnggal-Mnggal expunges needle-like projectiles of ooze within a 30-foot cone in any direction. All
          creatures in the area must make a DC 14 Dexterity saving throw or take 11 (2d10) acid damage on a failed save.
          Additionally, on a failed save, a target must make a DC 16 Constitution saving throw or become poisoned.
          Creatures poisoned in this way take 11 (2d10) poison damage at the start of their turn, and this damage
          ignores resistance and immunity. A creature reduced to 0 hit points by this damage is killed instantly, and
          rises the next round as a Mnggal-Mnggal zombie. Creatures can repeat the saving throw at the end of their
          turn, ending the effect on a successful save. Unconscious creatures make this save with disadvantage.</p>
        chat: ""
      requirements: ""
