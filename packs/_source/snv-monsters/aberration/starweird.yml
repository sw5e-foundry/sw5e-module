          of the starweird must succeed on a DC 15 Wisdom saving throw. On a failure, a creature takes 21 (6d6) psychic
          damage plus 21 (6d6) necrotic damage and is frightened for 1 minute. A creature can repeat the saving throw at
          the end of each of its turns, ending the effect on itself. On a success, a creature takes half damage and is
          not frightened.</p>
