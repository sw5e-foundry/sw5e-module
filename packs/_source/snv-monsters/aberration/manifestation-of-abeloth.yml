      description:
        value: >-
          <p>The manifestation exerts its will on one creature it can see within 120 feet. The target must succeed on a
          DC 23 Wisdom saving throw. On a failed save, the target is overcome with insanity. While under this effect, a
          creature can't take reactions and must roll a d8 at the start of its turn to determine its behavior for that
          turn. On a roll of a 1, the creature uses all its movement to move in a random direction and doesn’t take any
          actions that turn. On a 2-6, the creature doesn't move and takes no actions that turn. On a 7-8, the creature
          uses its action to make a melee attack against a randomly determined creature within its reach. If there is no
          creature within its reach, the creature does nothing that turn. This effect lasts until the start of the
          manifestation's next turn.</p>
