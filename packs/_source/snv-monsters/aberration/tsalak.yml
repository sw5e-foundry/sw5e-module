    system:
      description:
        value: >-
          <p>When the t'salak deals damage to a creature with a melee attack, the creature must make a DC 17 Wisdom
          saving throw. On a failed save, the creature must make at least one attack against the closest ally if it
          makes an attack on its turn. An affected creature can repeat the saving throw at the end of each of its turns,
          ending the effect on itself on a success.</p>
