          approvedBatch: fts-nonforce-aberration-reopen
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Hssiss venom is potent and imbued with the dark side. At the end of a long rest, a creature poisoned by the
          hssiss must make a DC 16 Constitution saving throw. On a failed save, the creature takes 14 (4d6) necrotic
          damage, and its hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts
          until the target finishes a long rest after the poison is cured. The creature recovers from the poison by
          making two consecutive successful saving throws. A force-based *Improved Restoration* power cures the poison,
          while *Restoration* gives the creature advantage on the next saving throw. The target dies if this effect
          reduces its hit point maximum to 0.</p>
        chat: ""
