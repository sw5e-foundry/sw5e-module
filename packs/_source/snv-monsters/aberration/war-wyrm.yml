    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +13 to hit, reach 10 ft., one target. Hit: 25 (4d8 + 7) kinetic damage. If the
          target is a Large or smaller creature, it must succeed on a DC 17 Dexterity saving throw or be swallowed by
          the wyrm. A swallowed creature is blinded and restrained, it has total cover against attacks and other effects
          outside the wyrm, and it takes 21 (6d6) acid damage at the start of each of the wyrm's turns. If the wyrm
          takes 30 damage or more on a single turn from a creature inside it, the wyrm must succeed on a DC 20
          Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in
          a space within 10 feet of the wyrm. If the wyrm dies, a swallowed creature is no longer restrained by it and
          can escape from the corpse by using 20 feet of movement, exiting prone.</p>
