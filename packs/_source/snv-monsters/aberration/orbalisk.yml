  - _id: 49e0c9265e7ba8e8
    name: Attach
    type: weapon
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: natural
          kind: weaponNatural
          sourceActionNames:
            - Attach
          duplicateActionProhibited: true
          canonicalWeaponSource: null
          ammoSource: null
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3a-p2
    img: modules/sw5e-module/icons/packs/monsters/100_-_Orbalisk/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +6 to hit, reach 5 ft., one target. *Hit:* 8 (1d8 + 4) kinetic damage, and the
          orbalisk attaches to the target. Once attached to a target, the orbalisk begins to reproduce through
          fragmentation. Whenever the host completes a long rest, it must make a DC 14 Wisdom saving throw. For each
          saving throw the host fails, the size of its Hit Dice is reduced: from d12 to d10, from d10 to d8, from d8 to
          d6, from d6 to d4, or from d4 to d2. If the host fails a saving throw while its Hit Die is a d2, it dies as
          the orbalisks consume it. While attached, the orbalisk can make this attack only against the target and has
          advantage on the attack roll. The orbalisk can detach itself by spending 5 feet of its movement.</p>
        chat: ""
