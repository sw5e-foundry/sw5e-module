            family: recharge
            min: 6
            max: 6
            runtimeAutomation: true
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>While submerged, the leviathan creates a wall of water centered on itself. The wall is up to 250 feet long,
          up to 250 feet high, and up to 50 feet thick. When the wall appears, all other creatures within its area must
          each make a DC 23 Strength saving throw. A creature takes 33 (6d10) kinetic damage on failed save, or half as
          much damage on a successful one. At the start of each of the leviathan's turns after the wall appears, the
          wall, along with any other creatures in it, moves 50 feet away from the leviathan. Any Huge or smaller
          creature inside the wall or whose space the wall enters when it moves must succeed on a DC 23 Strength saving
          throw or take 27 (5d10) kinetic damage. A creature takes this damage no more than once on a turn. At the end
          of each turn the wall moves, the wall's height is reduced by 50 feet, and the damage creatures take from the
          wall on subsequent rounds is reduced by 1d10. When the wall reaches 0 feet in height, the effect ends. A
          creature caught in the wall can move by swimming. Because of the force of the wave, though, the creature must
          make a successful DC 23 Strength (Athletics) check to swim at all during that turn.</p>
