    img: modules/sw5e-module/icons/packs/monsters/381_-_Mnggal-Mnggal_2C_Pool_of/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Mnggal-Mnggal expunges needle-like projectiles of ooze within a 30-foot cone in any direction. All
          creatures in the area must make a DC 17 Dexterity saving throw or take 16 (3d10) acid damage on a failed save.
          Additionally, on a failed save, a target must make a DC 19 Constitution saving throw or become poisoned.
          Creatures poisoned in this way take 22 (4d10) poison damage at the start of their turn, and this damage
          ignores resistance and immunity. A creature reduced to 0 hit points by this damage is killed instantly, and
          rises the next round as a Mnggal-Mnggal zombie. Creatures can repeat the saving throw at the end of their
          turn, ending the effect on a successful save. Unconscious creatures make this save with disadvantage.</p>
