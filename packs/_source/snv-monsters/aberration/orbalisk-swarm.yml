  - _id: 54f69760acea3891
    name: Attach
    type: weapon
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: natural
          kind: weaponNatural
          sourceActionNames:
            - Attach
          duplicateActionProhibited: true
          canonicalWeaponSource: null
          ammoSource: null
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3a-p3
    img: modules/sw5e-module/icons/packs/monsters/254_-_Orbalisk_Swarm/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +7 to hit, reach 0 ft., one target in the swarm's space. *Hit:* 13 (2d8 + 4) kinetic
          damage, or 8 (1d8 + 4) kinetic damage if the swarm has half its hit points or fewer, and the swarm attaches to
          the target. Once attached to a target, the swarm begins to reproduce through fragmentation. Whenever the host
          completes a long rest, it must make a DC 14 Wisdom saving throw. For each saving throw the host fails, the
          size of its Hit Dice is reduced: from d12 to d10, from d10 to d8, from d8 to d6, from d6 to d4, or from d4 to
          d2. If the host fails a saving throw while its Hit Die is a d2, it dies as the swarm consumes it. While
          attached, the swarm can make this attack only against the target and has advantage on the attack roll. The
          swarm can detach itself by spending 5 feet of its movement.</p>
        chat: ""
      source:
        custom: SnV
