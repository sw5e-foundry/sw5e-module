  - _id: 674eb251a3a2e021
    name: Infected Phlegm
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3a-p5
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The rakghoul spits out a deluge of sickly green mucus at three points of its choice within 60 feet of it,
          each splashing down in a 10-foot radius around the point. Each creature in an affected area must succeed on a
          DC 17 Dexterity saving throw or take 10 (3d6) acid damage and be coated in slime. A creature coated in this
          slime gains one level of the slowed condition, and when it makes a saving throw, it must roll a d4 and
          subtract the number rolled from the total. For each coating of slime affecting a creature, it gains an
          additional level of slowed and the d4 roll increases by 1d4. On a successful save, a creature takes half
          damage and isn't slimed. A creature may repeat the saving throw at the end of its turn, ending the effect on a
          success. A creature in the area of more than one deluge of mucus is only affected once. A creature affected by
          three coatings of slime is automatically infected with Rakghoul Plague.</p>
        chat: ""
      requirements: ""
