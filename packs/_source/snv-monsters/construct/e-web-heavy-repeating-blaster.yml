    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>This action may only be taken on a round in which the Regulate action has been taken on this construct. The
          construct thoroughly saturates a 15-foot-cube within 200 feet with shots. Any creature who enters the
          saturated area or begins its turn in the area must make a DC 13 Dexterity saving throw. On a failure, the
          target takes 28 (4d12 + 2) energy damage and is restrained until the start of their next turn. On a success,
          the target takes half damage and must succeed on a DC 13 Wisdom saving throw or become frightened until the
          start of their next turn.</p>
