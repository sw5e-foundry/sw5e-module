    system:
      description:
        value: >-
          <p>For 1 minute, the mercenary can utter a special command or warning whenever a nonhostile creature that it
          can see within 30 feet of it makes an attack roll or a saving throw. The creature can add a d4 to its roll
          provided it can hear and understand the mercenary. A creature can benefit from only one Leadership die at a
          time. This effect ends if the mercenary is incapacitated.</p>
