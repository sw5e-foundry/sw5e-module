    system:
      description:
        value: >-
          <p>The trooper slams its hammer into the ground, creating a shockwave that extends in a 10-foot radius
          centered on itself. Each creature in the area must succeed on a DC 15 Strength or Dexterity saving throw
          (target's choice) or be knocked prone and take 16 (3d6 + 6) lightning damage. On a successful save, the
          creature takes only half damage, isn't knocked prone, and is pushed 5 feet away from the trooper into an
          unoccupied space. If no unoccupied space is within range, the creature instead falls prone.</p>
