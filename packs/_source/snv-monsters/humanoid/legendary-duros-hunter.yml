          screen, salvo* <br><br>5th-level: *override interface, paralyze creature, toxic cloud* <br><br>6th-level:
          *disintegrate, programmed illusion* <br><br>7th-level: *delayed explosion* <br><br>8th-level: *incendiary
          cloud* <br></p>
