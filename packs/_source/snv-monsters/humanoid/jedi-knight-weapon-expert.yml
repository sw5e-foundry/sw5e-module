    system:
      description:
        value: >-
          <p>The weapon expert is a 13th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 14, +6 to
          hit with force powers). It has 55 force points and knows the following force powers:<br>At-will: *burst, force
          disarm, force push/pull, saber reflect, saber ward, sonic charge, turbulence*<br><br>1st-level: *battle
          precognition, force throw, phasestrike, saber assault, slow descent*<br><br>2nd-level: *battle meditation,
          phasewalk, saber strike, stun*<br><br>3rd-level: *force repulse, knight speed, saber slash, sever force,
          telekinetic storm*<br><br>4th-level: *force immunity, freedom of movement, saber onslaught*</p>
