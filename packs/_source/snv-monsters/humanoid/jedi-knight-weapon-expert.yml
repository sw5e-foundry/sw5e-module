          Additionally, whenever you move, you can make one melee weapon attack against each creature you move within 5
          feet of for the first time this turn. On a hit, the attack deals an extra [[/r 1d6]] damage of the weapon's
          type, and the target must make a Strength saving throw. On a failed save, you can choose to either knock the
          target prone, or push it 5 feet away from you.</p>

