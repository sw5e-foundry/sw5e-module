  details:
    biography:
      value: >-
        <blockquote><p><i>"The Inquisitorius. A project of mine, long planned. Slaves to the light side once, now awake.
        Hunters, one and all."</i></p><p><span style="font-size:13px"><i>"What do they hunt?"</i></span></p><p><i>"Why,
        Jedi, of course."</i></p><p>- Darth Sidious and Darth Vader</p></blockquote><table class="userscript-table
        userscript-table-bordered" style="width:615.455px"><tbody><tr><td style="line-height:1.42857"><u>Organization
        type</u></td><td style="line-height:1.42857">Jedi hunters</td></tr><tr><td
        style="line-height:1.42857"><u>Founder(s)</u></td><td style="line-height:1.42857">Darth Sidious</td></tr><tr><td
        style="line-height:1.42857"><u>Leader(s)</u></td><td style="line-height:1.42857"><ul><li>Darth
        Vader</li><li>Grand Inquisitor</li></ul></td></tr><tr><td
        style="line-height:1.42857"><u>Sub-group(s)</u></td><td style="line-height:1.42857">Purge
        Trooper</td></tr><tr><td style="line-height:1.42857"><u>Headquarters</u></td><td
        style="line-height:1.42857"><ul><li><span style="background-color:transparent">Inquisitorius Headquarters,
        Coruscant</span><br /></li><li>Fortress Inquisitorius, Nur</li></ul></td></tr><tr><td
        style="line-height:1.42857"><u>Location(s)</u></td><td style="line-height:1.42857">Spire, Stygeon
        Prime</td></tr><tr><td style="line-height:1.42857"><u>Formed from</u></td><td style="line-height:1.42857">Jedi
        Order</td></tr><tr><td style="line-height:1.42857"><u>Date founded</u></td><td style="line-height:1.42857">By 18
        BBY</td></tr><tr><td style="line-height:1.42857"><u>Date dissolved</u><br /></td><td
        style="line-height:1.42857">Within three years of the Mission to Malachor<br /></td></tr><tr><td
        style="line-height:1.42857"><u>Affiliation</u></td><td style="line-height:1.42857"><ul><li><span
        style="background-color:transparent">Galactic Empire</span></li><li><span
        style="background-color:transparent">Sith Order</span></li></ul></td></tr></tbody></table><p>The Inquisitorius,
        also known as the Inquisitorius Program, the Order of Inquisitors, and the Imperial Inquisition, was an
        organization of mysterious, Force-sensitive dark side agents who served the Sith-ruled Galactic Empire. Members
        of the Inquisitorius were called Imperial Inquisitors, or simply Inquisitors, and were also nicknamed Red
        Blades. They were tasked with hunting down the remaining Jedi who had survived Order 66 at the end of the Clone
        Wars as part of the Great Jedi Purge, retrieving any children identified as Force-sensitive, as well as other
        political dissidents. The Inquisitors were governed by the Sith Lord Darth Vader, who was the apprentice to the
        Galactic Emperor, Sheev Palpatine, and led by an individual known only by his title, the Grand
        Inquisitor.</p><p>In the years leading up to the Galactic Civil War, the Inquisitors came into conflict with
        several Jedi and groups affiliated with surviving or former Jedi as part of the purge. One of these groups were
        the Spectres, a rebel cell that included the Jedi Purge survivor Kanan Jarrus and his Padawan, Ezra Bridger.
        Their pursuit of the Spectres also brought them into contact with another Jedi Purge survivor, the former Jedi
        Ahsoka Tano, as well as the former Sith Lord Maul, who sought revenge against the Sith for casting him out and
        killing his brother and mother. With the Empire believing the Jedi Order to be largely extinct, the
        Inquisitorius vanished by the time of the Galactic Civil War.</p><h3>History</h3><p><b>Serving the
        Sith</b></p><p>When the Clone Wars ended, Supreme Chancellor Sheev Palpatine, who was secretly the Dark Lord of
        the Sith Darth Sidious, formed the Galactic Empire and declared the Jedi Order its enemy. Using Jedi Master Mace
        Windu's attempt to have him arrested as justification, the new Emperor activated Order 66, which had been
        hardwired into every single one of the Republic's clone troopers by the Sith prior to the war, and instructed
        them to kill the Jedi. The majority of the Jedi were killed by the clones but several managed to escape,
        especially after Jedi Master Obi-Wan Kenobi sent out a distress signal from the Jedi Temple, warning the
        survivors off. As such, several Jedi had survived the initial purge and gone into hiding. Fearing the threat the
        surviving Jedi posed to his rule, Emperor Palpatine created the Inquisitors to track down and corrupt or
        eliminate the last remaining Jedi.</p><p>The Inquisitors were all former Jedi that had fallen to the dark side
        in some way or another, with the Grand Inquisitor having served as a Jedi Temple Guard, the Ninth Sister being
        former Jedi Masana Tide, the Tenth Brother being the former Jedi Master Prosset Dibs and the Second Sister being
        the former Jedi Padawan Trilla Suduri. The Emperor's apprentice Darth Vader soon discovered the program and was
        put in charge of them by his Sith Master. Vader trained the Inquisitors in the ways of the dark side of the
        Force. As part of their training, a number of Inquisitors had parts of their body severed by Vader's lightsaber
        so that they would not forget the lesson of loss. After Vader cut off Sixth Brother's left lower arm, the Grand
        Inquisitor began questioning Vader's training techniques. Vader claimed that he was intending to have the
        Inquisitors to abandon their tendency to fight defensively as former Jedi and adopt more offensive
        moves.</p><p><b>Hunting the Jedi</b></p><p>Following the formation of the Empire, the Grand Inquisitor worked
        with Darth Vader on locating the Jedi Order's Chief Librarian, Jocasta Nu. During his research in the Archives,
        the Grand Inquisitor was confronted by Nu after he openly insulted the knowledge he was reading. At first the
        Grand Inquisitor planned to kill Nu but when he defeated her in combat, he was prevented from killing her by
        Lord Vader. As Vader and the Grand Inquisitor argued, Nu was able to make her escape. However, Vader was able to
        pursue Nu and killed her himself without the Grand Inquisitor's help.<br /></p><p>Sometime later, the Ninth
        Sister accompanied Vader to investigate reports of a possible Jedi in a cantina on Cabarria. The reports turned
        out to be false and Vader was attacked by three bounty hunters. The Ninth Sister refused to help Vader and when
        he overpowered the bounty hunters, they retreated and stole the Ninth Sister's speeder at gunpoint. Vader chased
        and captured them, questioning them of who they were hired by. Vader found out that the culprit had come from
        the top of the Imperial ranks and the Ninth Sister flew him back to Coruscant. However, when arriving at
        Coruscant their communications were deliberately jammed, stopping the Ninth Sister from sending their clearance
        codes. This caused the Coruscant defenses to attack them and Vader pushed the Ninth Sister off the pilot chair
        to take control of the ship. They subsequently crashed onto Coruscant and Vader left the Ninth Sister with the
        ship.<br /></p><p><b>Mission to Mon Cala</b></p><blockquote><p><i>"As the Inquisitors were once Jedi themselves,
        and the clones were built to kill Jedi, wellâ€¦you see the result."</i></p><p><span style="font-size:13px">-
        Ferren Barr, on the Inquisitors and their Purge Troopers</span></p></blockquote><p>About one year after the rise
        of the Empire, Palpatine suspected a Jedi of influencing the deteriorating negotiations on Mon Cala. He sent
        Vader and three Inquisitors to investigate this, accompanied by a squad of elite clone Purge Troopers. Upon
        their arrival, the Imperial Ambassador Telvar was assassinated and his superior, Moff Tarkin, sent down his
        forces to invade Mon Cala. Vader and the Inquisitors Sixth Brother, Ninth Sister and Tenth Brother fought at Dac
        City and captured the king, Lee-Char. The Ninth Sister interrogated Lee-Char for the location of the Jedi but
        they were soon swept away by large waves generated by some of Mon Cala's large creatures.</p><p>The three
        Inquisitors survived the cataclysm and picked up Vader on an Imperial submarine. The Ninth Sister revealed to
        Vader that she had obtained the location of the Jedi and they made for the place. Upon arriving there, they were
        met by the Jedi and his six disciples. The group scattered, except for one that shot at the submarine until
        Vader crushed his helmet. As they chased the rest of them, another sacrificed himself to slow them down. Vader
        and the Inquisitors soon reached Bel City and made chase for the remaining of the group. Vader received a
        request from Moff Tarkin to capture Lee-Char and end the war on Mon Cala. Vader agreed and left the Inquisitors
        and their squad of clones to find the Jedi.</p><p>The Inquisitors soon found the Jedi and his last two
        disciples. The Sixth Brother cut down one of the disciples and they surrounded the other two. The Jedi then
        stepped forward and faced them, revealing their names from when they were Jedi. The Ninth Sister confronted the
        Jedi, identifying him as a Padawan named Ferren Barr. Barr ignored her and told them that they were still truly
        Jedi, acknowledging the clones and their role in Order 66. Barr used the Force to take the helmets off the Purge
        troopers and saw that they were newer clones that were commissioned after Order 66. Knowing they had not had
        their inhibitor chips activated, he used a mind trick on them, saying "execute Order 66".</p><p>The trick worked
        and the Purge troopers turned on their three superiors. They quickly succeeded in gunning down the Tenth
        Brother, although the Sixth Brother and Ninth Sister were able to deflect their shots. Barr and his last
        disciple, Verla, then leaped over the battle and escaped. Keen to intercept them, the Sixth Brother and Ninth
        Sister used their combined powers to Force push the troopers to the side. However, the Sixth Brother betrayed
        Ninth Sister, cutting her leg off and leaving her to fend off the last of the troopers alone. After his escape,
        the Sixth Brother took a boat away with three stormtroopers.</p><p><b>Search for Ahsoka Tano</b></p><p>Shortly
        after the mission to Mon Cala, the Sixth Brother was searching for a possible Force-sensitive child on Thabeska.
        However, he later abandoned this task after receiving word that a Force-sensitive old enough to have received
        Jedi training was hiding in the Outer Rim, and set out to hunt the individual in question, hoping to earn a
        promotion. The supposed Jedi was in fact former Padawan Ahsoka Tano, who had left the Jedi Order before the end
        of the Clone Wars after being wrongfully accused of treason. Tano had since built up a resistance group on the
        moon of Raada. The Sixth Brother went to Raada where he began investigating. He traveled to the mountains and
        found the resistance Tano had set up, who were hiding in the caves. The resistance surrounded the Sixth Brother
        but he revealed his lightsaber, throwing it at the fighters. The lightsaber flew in an arc, killing all but one
        of the fighters.</p><p>The Sixth Brother then took the last fighter away, who he identified as Kaeden Larte, who
        had become close to Tano. The Sixth Brother used Kaeden to lay a trap for Tano and she revealed herself to him.
        The Sixth Brother then battled her, but Tano was able to identify his offensive fighting style and took
        advantage of it. Tano then reached out to his lightsaber's kyber crystals and they detonated the lightsaber,
        killing the Sixth Brother. Tano took his lightsaber crystals and fled the system with the rest of the citizens
        from Raada's sole settlement. Shortly afterwards, the Grand Inquisitor arrived and, unaware of Tano's identity,
        decided to hunt her himself, but not before informing Vader.</p><p><b>Hunt for Eeth
        Koth</b></p><blockquote><p><i>"Inquisitors--A woman and an infant escaped. Bring me the child."</i></p><p><span
        style="font-size:13px"><i>"And the woman, Lord Vader?"</i></span></p><p><i>"Irrelevant."</i></p><p>- Darth Vader
        and the Fifth Brother</p></blockquote><p>Sometime after Vader's hunt on Chandar's Folly, he took three
        Inquisitors to a planet to hunt down the surviving Jedi known as Eeth Koth. Vader entered his house and
        interrupted Koth as his daughter had only just been born. Koth attempted to negotiate his way out of the
        situation but Vader made it clear he wasn't compliant and Koth attacked him, telling his wife, Mira, to run with
        his newborn daughter. The two took the fight outside and Vader threw him across the ground and told his
        Inquisitors to find the newborn and capture it. The Fifth Brother asked of what they should do about the mother
        and Vader informed him that she was irrelevant.</p><p>The three Inquisitors made haste into the city and the
        Fifth Brother suggested they split up. The other two agreed and they began searching the city. The female
        Inquisitor decided to reach out into the Force to see if the Infant made any ripples, as it was Force-sensitive.
        Her attempt was successful and she managed to stop Mira and her child before they could reach her father's
        shuttle. Mira begged her to let her go, appealing to her woman to woman. The female Inquisitor told her to go
        and she ran into the shuttle. The Fifth Brother then arrived and was shocked of what she had just done. The
        Twi'lek Inquisitor arrived as well and told her that Vader would not take this lightly. However, the female
        Inquisitor wasn't finished yet and as the shuttle ascended, she used the Force to pull the baby from her
        mother's arms.</p><p>The Twi'lek Inquisitor asked the female Inquisitor why she had to do it the way she did.
        She explained that since Mira had appealed to her woman to woman, she had decided to let her trust her before
        snatching her baby and thus her soul, as she would never trust another woman, and likely another person, again.
        The three Inquisitors returned to Vader, who was gradually beating Koth in the duel. Koth saw the baby in the
        female Inquisitor's hands and in his shock, Vader cut him down. The group returned to the Coruscant tower on
        their Zeta-class shuttle and gave the baby to a pair of nursemaids. Vader asked the Grand Inquisitor of their
        next target. The Grand Inquisitor brought Vader to see the list of the final confirmed Jedi survivors. There, he
        explained to Vader that they had hidden well and he concluded that they must wait until one of them made a
        mistake in order to find them.</p><p><b>Rogue Inquisitors</b></p><blockquote><p><i>"What are we looking for,
        Lord Vader?"</i></p><p><span style="font-size:13px"><i>"Two Jedi. Male and female. They will attack us. It is
        only a matter of time. Be wary. They are cunning. Their direction of attack may
        beâ€¦unorthodox."</i></span></p><p>- Two Imperial shock troopers, and Darth Vader</p></blockquote><p>The Fifth
        Brother notified Vader of the female Inquisitor's actions during their hunt and Vader suspected her to be a
        traitor, especially as he suspected her and the Twi'lek Inquisitor of having feelings for each other. Later on,
        the female Inquisitor and the Twi'lek Inquisitor were toasting to Eeth Koth's death with a drink that came from
        the planet where they had found him. The female Inquisitor then brought up Vader and asked of what he would do
        when all the Jedi were finally dead. The Twi'lek Inquisitor told her he would find his way around it, saying he
        would always find something to kill. At that moment, Vader interrupted their conversation, igniting his
        lightsaber. The Grand Inquisitor asked if this was a test, to which Vader coldly denied. Vader attempted to kill
        the female Inquisitor, but the Twi'lek Inquisitor halted him with his lightsaber and Vader confirmed his
        suspicions that the two had an attachment. The female Inquisitor ran away and Vader threw the other into the
        wall. He asked Vader why he attacked the female Inquisitor and he told the Twi'lek that it didn't matter because
        he had done it too. The Twi'lek Inquisitor ran and joined the female Inquisitor as she escaped the Coruscant
        Tower.</p><p>Vader made chase for the two rogue Inquisitors and took a speeder into Coruscant. The pair planned
        on killing Vader in order for them to be free from his presence in the galaxy. They therefore attacked Vader's
        speeder and the Sith lord jumped to other speeders as they cut those down as well with their lightsabers. The
        pair then resorted to throwing speeders at the Sith but he either threw them back or cut them down. However, the
        two Inquisitors eventually managed to topple a statue onto Vader and he fell onto a balcony, temporarily
        immobilized. They attempted to finish him off but he used the force to freeze them in mid air. The two
        Inquisitors turned to one another to spill out their last words and Vader made their lightsabers activate to
        stab the pair and kill them at the same time. Sidious later asked Vader why he thought the two were traitors and
        he explained to his master of their attachment and how the female Inquisitor briefly let Eeth Koth's child
        escape. Nonetheless, the Emperor was displeased with Vader's rampage that killed a Gran senator who was
        important to his plans and had the Inquisitorius relocated offworld.</p><p><b>Further
        events</b></p><blockquote><p><i>"If we do not stop the Inquisitor, you will. If we do not stop the Empire, you
        will."</i></p><p><span style="font-size:13px">- Nuhj, in a recording made just prior to his
        death</span></p></blockquote><p>An Inquisitor was sent by the Empire to hunt a small group of surviving Jedi who
        had recently been discovered in a Jedi shrine on Anoat. The Inquisitor went there to find the Jedi Mususiel, who
        stayed to save the others. The Inquisitor killed her and tracked the others to Mataou, where the agent pursued
        one of the others, named Zubain Ankonori, and slew him. The last two Jedi, Nuhj and Khandra, fled to Embertown
        on the planet Burnin Konn, but the Inquisitor soon followed and attacked them in a chromium mine near Wickridge.
        The Inquisitor slew them and their belongings were stored in an Imperial vault on Nar Hypa.</p><p>At one point,
        a female Inquisitor was on Dathomir when she encountered Jerserra, a Dathomirian from the Nardithi Nightsisters,
        a sect of the Nightsisters. She took in Jerserra as her secret apprentice and spent a number of years training
        her in combat and lightsaber combat. The Inquisitor hoped to use Jerserra against the other Inquisitors but
        Jerserra eventually came to believe her abilities outmatched her Master's, and before long, the Inquisitor was
        slain by Jerserra, who covered up her murder and took her lightsaber as her own.</p><p><b>Hunting Cal
        Kestis</b></p><p>The Second Sister and the Ninth Sister were sent by the Empire to hunt Cal Kestis, a former
        Padawan who was discovered on Bracca after an Imperial viper probe droid witnessed him using the Force to save
        his friend. The Second Sister ordered a group of Bracca Scrappers, including Kestis and his friend Prauf, to
        reveal who the secret Jedi was. Prauf came forward to confess as the Jedi, but the Second Sister killed him on
        the spot, to where Kestis revealed his lightsaber in anger. Kestis was rescued by the Mantis crew and joined
        with former Jedi Knight Cere Junda on a secret mission to rebuild the Jedi Order. Kestis defeated the Ninth
        Sister on Kashyyyk. The Second Sister was killed by Vader during the mission to Nur after she began to reconcile
        with Junda, her former Jedi master, who apologized for letting her fall to the dark side and become an
        Inquisitor, and for failing to obtain a holocron that Kestis had retrieved containing a list of Force-sensitive
        children. Kestis, Junda, and the Mantis crew escaped Fortress Inquisitorius, and Kestis subsequently destroyed
        the holocron to prevent the Empire from obtaining it, entrusting the fates of the children to the
        Force.</p><p><b>Hunting the Spectres</b></p><blockquote><p><i>"You have great potential, but perhaps it is I
        that might teach you, as your master never achieved the rank of Jedi Knight. Did he?"</i></p><p><span
        style="font-size:13px"><i>"Maybe not, but he took out the last Inquisitor. So I think I'll just stick with
        him."</i></span></p><p><i>"Yes, the death of the Grand Inquisitor was a surprise to all. Yet, it does present
        the rest of us with new opportunities."</i></p><p>- The Seventh Sister and Ezra Bridger</p></blockquote><p>When
        rumors emerged of a Jedi leading a rebel cell on the planet Lothal reached the ears of the Empire, Vader sent
        the Grand Inquisitor to take care of the problem. After several encounters, the Grand Inquisitor succeeded in
        capturing Jarrus, but was defeated by the latter in a lightsaber duel during a rescue staged by the rebels and
        Jarrus's Padawan, Ezra Bridger. Rather than face his Master's punishment for his failure, the Grand Inquisitor
        killed himself.</p><p>During a skirmish with Phoenix Cell, Vader learned that Tano, who had been his apprentice
        during the Clone Wars, was still alive. Upon learning of this news, the Emperor ordered Vader to dispatch
        another Inquisitor to hunt the rebels down. As a slight alteration of the Emperor's commands, two
        Inquisitorsâ€”the Fifth Brother and the Seventh Sisterâ€”were assigned to do so. They confronted several crew
        members of the Ghost during a skirmish aboard an abandoned Republic medical station. Due to Garazeb Orrelios'
        quick-thinking, the rebels managed to escape the Inquisitors aboard the Phantom.</p><p>The death of the Grand
        Inquisitor was a great surprise for the other Inquisitors who saw new opportunities in hunting down the ones
        responsible. In addition to the Seventh Sister and the Fifth Brother, several other Inquisitors began to scour
        the galaxy searching for the two Jedi who had defeated their leader, all of them hoping to advance their own
        position within the Inquisitorius. While intercepting transmissions from Mustafar, Tano discovered that the
        Inquisitors' second mission was to kidnap Force-sensitive children. Meanwhile, the Seventh Sister and the Fifth
        Brother kidnapped the infants Alora and Pypey above the planets Chandel and on Takobo respectively. This brought
        them into contact with the crew of the Ghost and Ahsoka, who soundly defeated them in combat. Later, the Seventh
        Sister and the Fifth Brother took part in an unsuccessful attempt to capture the rebels in Garel
        City.</p><p>Three years before the Battle of Yavin, the Fifth Brother and the Seventh Sister spent several
        months pursuing Jarrus and Bridger. On one occasion, they managed to track the Jedi to the planet Oosalon where
        they fought with them. Despite their efforts, the Jedi managed to escape and regroup with the Spectres. Later,
        the Inquisitors followed Jarrus, Bridger, and Tano to the Lothal Jedi Temple. After forcing their way into the
        temple, the two Inquisitors were attacked by ghostly apparitions of the Jedi Temple Guards. One of these
        apparitions was the former Grand Inquisitor. The Fifth Brother and Seventh Sister survived the encounter and
        reported to Vader, who vowed to put an end to the Jedi threat.</p><p><b>Crossover at Malachor</b></p><p>Some
        time after the events of the Lothal Jedi Temple, Kanan, Ezra and Ahsoka traveled to Malachor, following a hint
        given by Jedi Master Yoda. When they arrived there, the Eighth Brother, who was already there hunting an
        individual known as the shadow, attacked them. Soon after, Bridger became separated from the others and
        encountered the former Sith apprentice Maul. As this was happening, Tano and Jarrus chased and captured the
        Eighth Brother, who unbeknownst to them sent a distress signal to his fellow Inquisitors, the Fifth Brother and
        the Seventh Sister. Maul and Bridger together entered the Sith temple on Malachor and retrieved the Sith
        holocron inside.</p><p>Shortly later, they found the Fifth Brother, Seventh Sister and Eighth Brother dueling
        Tano and Jarrus. Maul and Bridger intervened and the Inquisitors were forced to retreat. While attempting to
        plant the Sith holocron in the Sith temple's obelisk, they encountered the Inquisitors once again. Maul began
        Force choking the Seventh Sister and urged Bridger to strike her down. When Bridger could not bring himself to
        do it, Maul then threw his lightsaber at her, killing her instantly. Maul and Bridger then found Tano and Jarrus
        once more fighting the Fifth and Eighth Brothers. After Tano destroyed the Fifth Brother's lightsaber, Maul made
        quick work of him with a fatal slash to the gut. During this time, Jarrus had also managed to slice the Eighth
        Brother's lightsaber. Cornered and outnumbered, the Eighth Brother attempted to escape by using his lightsaber
        to hover away but the lightsaber malfunctioned in flight and sent the Eighth Brother plummeting to his death at
        the base of the temple below.</p><p><b>Disappearance</b></p><blockquote><p><i>"During the early years of the
        Empire, the red blades of the Inquisitorius cut a swath through the galaxy as they wiped any remaining traces of
        the Jedi Order from existence. Once the Jedi were finally considered extinct by the Empire, the Inquisitorius
        vanished into the darkness as well."</i></p><p><span style="font-size:13px">- Luke
        Skywalker</span></p></blockquote><p>In 2 BBY, around six months after the Inquisitors' failure incident on
        Malachor,[9] the Empire dispatched Grand Admiral Thrawn to finish what Darth Vader and his Inquisitors started.
        Thrawn pursued the rebels until his defeat during the Liberation of Lothal.</p><p>In 0 BBY, the Jedi Order was
        largely thought to be extinct by the Empire, and once their objective of wiping out the Jedi was completed, the
        Inquisitors themselves vanished as well. At a meeting aboard the first Death Star, Grand Moff Wilhuff Tarkin
        expressed his belief that Vader was the only living practitioner of what he termed "the ancient
        religion".</p><p><b>Legacy</b><br /></p><blockquote><p><i>"The Jedi aren't my story. So what if I'm meant to
        become one of these Inquisitors, instead?"</i></p><p><span style="font-size:13px"><i>"I believe we've learned
        that they no longer exist."</i></span></p><p><i>"But what if they come back? What if my vision was of the future
        and I become some sort of anti-Jedi Knight. [...] What if the Force awakens and there are those who want to
        snuff it out again? What if there are dark side users who are meant to do such a thing, and I'm meant to become
        one of them?"</i></p><p>- Karr Nuq Sin and RZ-7</p></blockquote><p>Around thirty years after the Battle of
        Yavin, the Inquisitors and, much like the Jedi they hunted, their history was little-known. By this time the
        antiques collector Dok-Ondar acquired a broken lightsaber that once belonged to the Grand Inquisitor. When Karr
        Nuq Sin, a Force-sensitive teenager seeking to understand his connection with the Force and the ways of the
        Jedi, visited Dok-Ondar's Den of Antiquities hoping to find Jedi artifacts, Dok-Ondar showed him the Inquisitor
        lightsaber. He explained the mission of the Inquisitors to Nuq Sin and the boy had never heard of them or the
        fact that the Jedi were hunted down after the Clone Wars. When Nuq Sin, who possessed the Force power of
        psychometry, touched the two broken pieces of the lightsaber he experienced two visions simultaneously: one of
        his former Jedi Padawan great-grandfather Naq Med fighting the Grand Inquisitor and another of the Grand
        Inquisitor fighting and killing a different Jedi. The overlapping visions gave Nuq Sin, who strongly resembled
        his relative, the impression that he had witnessed his future self kill a Jedi. The visions caused him to doubt
        whether he was meant to become a Jedi and fear that in his future the defunct Inquisitorius would be resurrected
        and he would become an Inquisitor.</p><p>The First Order, the government that rose from the ashes of the Empire
        following its fall after the New Republic's victory at the Battle of Jakku and the subsequent signing of the
        Galactic Concordance, used interrogation chairs, based on those used by the Inquisitorius, to extract
        information from their prisoners.</p><p>Around the time of the First Orderâ€“Resistance war, the Jedi Master
        Luke Skywalker wrote a book chronicling what he knew of the history of the Jedi Order. In the book, Skywalker
        included a brief history of the Inquisitorius and their mission of hunting the Jedi, identified several of them
        by the names they bores as Inquisitors and noted that once the Jedi were considered extinct, the Inquistors
        themselves vanished. He also wrote about the signature double-bladed spinning lightsabers used by Inquisitors.
        The dark side warrior Knights of Ren who served Darth Vader's grandson Kylo Ren in the same time period would
        have been prime candidates to become Inquisitors in previous generations, if they could be
        tamed.</p><h3>Organization</h3><p><b>Status and command</b></p><p>Although the exact number of Inquisitors was
        kept secret, there may have been as many as twelve. Inquisitors utilized a Zeta-class shuttle named the Infernum
        in 18 BBY, and commanded Purge Troopers, elite death squads comprised of the last generation of clones brought
        online after the Jedi Purge. Due to the nature of their mission, Inquisitors had the power to commandeer any
        required Imperial Military forces, and all officers were to obey their orders. Any officer who came into contact
        with Force-sensitive beings was to immediately contact an Inquisitor to investigate the situation. Also, some
        Imperial officers disliked the interference of Inquisitors with some, such as Admiral Kassius Konstantine. When
        inducted into the ranks of the Inquisitorius, individuals left behind their names and took up new ones, being
        labelled Brother/Sister denoting their sexes.</p><p><b>Inquisitor mutuality</b></p><blockquote><p><i>"Smells
        like fish."</i></p><p><span style="font-size:13px"><i>"That's just Sixth Brother."</i></span></p><p><i>"More
        like fish, then."</i></p><p><i>"Hilarious."</i></p><p>- The Tenth Brother and Ninth Sister make fun of Sixth
        Brother</p></blockquote><p>The Inquisitors in the Inquisitorius held a mutual relationship with each other. Many
        had to work together on occasions where they were up against bigger threats. The female Inquisitor and the
        Twi'lek Inquisitor had a mutual friendship and always toasted to the death of every Jedi they hunted with a
        drink made on the planet of which they found them. However, being users of the dark side of the Force, the
        Inquisitors became power hungry and a sense of competition grew between them. Upon arriving at Mon Cala, the
        Sixth Brother was insulted by his two subordinates, the Ninth Sister and Tenth Brother.</p><p>Later on, the
        three aforementioned Inquisitors were caught up in a skirmish in Bel City and the Tenth Brother was killed. The
        other two helped each other clear a path but then the Sixth Brother betrayed the Ninth Sister, cutting off her
        leg and leaving her to the remainder of the enemy. The Sixth Brother later abandoned one of his missions to hunt
        a Jedi, hoping to obtain himself a promotion. A female Inquisitor trained her own apprentice to use against the
        other Inquisitors before she was betrayed and killed by the Dathomirian. During his search for the Spectres, the
        Seventh Sister decided to intervene with the Fifth Brother's hunt to obtain the kill for
        herself.</p><h3>Operations</h3><blockquote><p><i>"I've read the reports from the Inquisitorius. Vader and his
        monsters have done their job well. Few Jedi remain, if any."</i></p><p><span style="font-size:13px">- Tarkin on
        the Inquisitorius</span></p></blockquote><p>The Inquisitors' primary objective was to hunt down and turn to the
        dark side (if possible) or kill (if not) Jedi who had survived the initial stages of the Great Jedi Purge. The
        Inquisitors' secondary objective was to prevent Force-sensitive children from falling into the hands of the
        remaining Jedi or using their skills against the Empire. As part of this strategy, an operation code-named
        Project Harvester was designed to identify cadets in Imperial academies across the galaxy who met the criteria
        that would identify them as Force-sensitive. Should they be identified as such, the cadets would be abducted and
        taken into custody. Individuals who refused to serve the Galactic Empire would then be eliminated.</p><p>As well
        as Imperial cadets, Project Harvester also targeted infants that were identified as Force-sensitive. One of the
        infants they took was the daughter of former Jedi Master Eeth Koth. The baby was given to the Nursemaids after
        being taken. Besides hunting Jedi, the Inquisitors were also known to pursue other Force-sensitive opponents of
        the Sith, like the renegade dark sider Maul. The Inquisitor's hunt saw gradual success overtime. Moff Wilhuff
        Tarkin read reports from the Inquisitorius and saw that their hunt had rid the galaxy of most, if not all of the
        surviving Jedi.</p><h3>Equipment</h3><blockquote><p><i>"How did you know?"</i></p><p><span
        style="font-size:13px"><i>"That you were a fake? An Inquisitor without a lightsaber? You must think me a
        foolâ€¦"</i></span></p><p>- Lina Graf and VaneÃ©, on the former's impersonation of the "Fourth
        Sister"</p></blockquote><p>The Inquisitors wore black and grey bodysuits with armor and were equipped with
        crimson-bladed lightsabers, typically of the double-bladed spinning lightsaber model that were also capable of
        spinning in a helicopter-like motion for escape due to their ringed emitters. The Tenth Brother was an
        exception, possessing two separate shoto lightsabers. The Inquisitors also developed interrogation chairs to
        assist in their questioning of suspected rebels or Jedi.</p><h3><b>Skills and
        training</b></h3><blockquote><p><i>"The Inquisitors are formidable fighters. They are former
        Jedi!"</i></p><p><span style="font-size:13px"><i>"And they fight like it. Defensive. Moving to attack only when
        there is no other choice. The Jedi taught that a battle could be counted a victory even if both parties survive.
        This error has infected the Inquisitors' tactics."</i></span></p><p>- The Grand Inquisitor and Darth
        Vader</p></blockquote><p>Being former Jedi meant the Inquisitors were weak in the dark side of the Force. Darth
        Vader noticed this when he began training them. Vader aimed to cut the Inquisitors from their more defensive
        fighting style and make it only offensive, something Ahsoka Tano took advantage of when fighting the Sixth
        Brother. One of Vader's first training sessions with them included teaching them loss by expending at least one
        of their limbs, such as the Sixth Brother's left forearm, the Fifth Brother's right hand and the Ninth Sister's
        left eye.</p><p>Some of the Inquisitors had different strengths in fighting, such as the Ninth Sister, who was
        stronger in reading emotions, and the Tenth Brother, who had exceptional hearing and intuition in-spite of his
        lack of eyes. Several of them also studied the records of the Jedi Order to familiarize themselves with their
        enemies' fighting techniques, making them dangerous fighters. However, despite being assigned to hunt and kill
        Jedi and other Force-sensitive targets, most of the Inquisitors were not skilled enough to take on powerful
        Force-users; two working in tandem were defeated by Ahsoka Tano, and three combined were unable to overcome
        former Sith Lord Maul, Ahsoka and Kanan. However, some Inquisitors were more successful in their hunting, with
        one Inquisitor being able to hunt and kill four Jedi in the Anoat sector.</p>
