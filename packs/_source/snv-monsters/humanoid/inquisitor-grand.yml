    name: Forcecasting
    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The inquisitor is a 12th-level forcecaster. Its forcecasting ability is Charisma (force save DC 18, +10 to
          hit with force powers). It has 53 force points and knows the following force powers:<br>At-will: *denounce,
          force disarm, force push/pull, saber throw, slow* <br><br>1st-level: *dark side tendrils, force jump, sap
          vitality, sense force* <br><br>2nd-level: *animate weapon, drain vitality, force confusion, force sight,
          improved saber throw, stun* <br><br>3rd-level: *choke, force suppression, horror, improved dark side tendrils,
          sever force* <br><br>4th-level: *dominate beast, drain life, mind trap* <br><br>5th-level: *dominate mind,
          greater saber throw, siphon life* <br></p>
