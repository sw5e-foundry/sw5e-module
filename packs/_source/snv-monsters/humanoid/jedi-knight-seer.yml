    name: Forcecasting
    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The seer is a 9th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 16, +8 to hit with
          force powers). It has 41 force points and knows the following force powers:<br><br>At-will: *affect mind,
          force leap, force push/pull, mind trick, saber reflect, saber throw, saber ward, turbulence*<br><br>1st-level:
          *battle precognition, disperse force, force blinding, force jump, force propel, force reflect, heighten
          senses, malacia, shadow sight*<br><br>2nd-level: *animate weapon, battle meditation, force confusion, force
          vision, improved saber throw, phasewalk*<br><br>3rd-level: *force suppression, mass malacia, remove curse,
          sever force, telekinetic shield, telekinetic storm*<br><br>4th-level: *force immunity, freedom of
          movement*<br><br>5th-level: *force breach, greater saber throw, improved battle meditation*<br></p>
