    system:
      description:
        value: >-
          <p>The mandalorian chooses a creature that it can see within 90 feet and marks it as their quarry. For the
          next 10 minutes, once per round, when it hits its quarry with a weapon attack, the mandalorian can deal an
          additional 4 (1d8) damage to it of the same type as the weapon’s damage. Additionally, the mandalorian has
          advantage on any Wisdom (Perception) or Wisdom (Survival) checks made to find its quarry while it’s on the
          same planet.</p>
