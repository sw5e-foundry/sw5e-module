    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Mind Trick</em></p>

          <p>Until the power ends or you use an action to dismiss it, you can disguise yourself through use of the Force
          in many ways. You can appear to be shorter or taller by about a foot and change the appearance of your body
          and weight, but you cannot change the basic structure of your body. This effect can include your clothes,
          weapons, and other belongings on your person.</p>

          <p>This effect is only visual, so any sort of physical contact will only interact with the real size and shape
