    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Darkness</em></p>

          <p>You become heavily obscured to others. Dim light within 10 feet of you becomes darkness, and bright light
          becomes dim light.</p>

          <p>Until the power ends, you have resistance to force damage. Additionally, whenever a creature within 10 feet
          of you hits you with an attack, it takes [[/r 2d8]] necrotic damage.</p>
