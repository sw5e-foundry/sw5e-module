    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The sage is a 11th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 16, +8 to hit with
          force powers). It has 49 force points and knows the following force powers:<br>At-will: *force disarm, force
          technique, force push/pull, saber reflect, saber ward, turbulance*<br><br>1st-level: *battle precognition,
          disperse force, force reflect, heal, phasestrike*<br><br>2nd-level: *animate weapon, battle meditation,
          phasewalk, stun*<br><br>3rd-level: *force repulse, knight speed, plant surge, telekinetic
          storm*<br><br>4th-level: *grasping vine, mind trap*<br><br>5th-level: *improved battle meditation, improved
          heal, improved phasestrike, improved phasewalk, stasis, mass animation*<br><br>6th-level: *telekinetic burst,
          wall of light*<br></p>
