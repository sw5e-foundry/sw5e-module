  - _id: a7ab6ad46b3d5f90
    name: Force Push/Pull
    type: spell
    img: modules/sw5e-module/icons/packs/Force%20Powers/ForcePush-Pull.webp
    effects: []
    folder: null
    sort: 0
    flags:
      sw5e-importer:
