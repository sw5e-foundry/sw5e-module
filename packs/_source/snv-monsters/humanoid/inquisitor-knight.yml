        value: >-
          <p>As a part of the action used to cast this power, you must make a ranged force attack with a lightweapon or
          vibroweapon against one target within the power's range, otherwise the power fails. On a hit, the target takes
          [[/r 1d8]] damage of the same type as the weapon's damage. The weapon then immediately returns to your
          hand.</p>

          <p>This power can hit multiple targets when you reach higher levels: two targets at 5th level, three targets
          at 11th level, and four targets at 17th level. Each target must be within 30 feet of the previous target, you
          must make a separate attack roll for each target, and the last target must be no further than 30 feet away
          from you. You can not hit the same target twice in succession.</p>
