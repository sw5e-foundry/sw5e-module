    system:
      description:
        value: >-
          <p>The inquisitor is a 6th-level forcecaster. Its forcecasting ability is Charisma (force save DC 14, +6 to
          hit with force attacks). It has 28 force points and knows the following force powers:<br>At-will: *denounce,
          force disarm, saber throw, slow* <br><br>1st-level: *burst of speed, dark side tendrils, fear, force jump,
          hex, sense force* <br><br>2nd-level: *force sight, improved saber throw, stun* <br><br>3rd-level: *improved
          dark side tendrils, knight speed* <br></p>
