          area is heavily obscured. It lingers in the air for the duration.</p>

          <p>Each creature completely in the cloud at the start of its turn must make a Constitution save against
          poison. On a failure, the creature does nothing that turn. Creatures that don't need to breathe or are immune
          to poison automatically succeed.</p>

          <p>A wind of 10mph disperses the cloud after 4 rounds. A wind of 20mph disperses it after 1 round.</p>
