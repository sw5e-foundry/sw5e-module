        value: >-
          <p>*Melee Weapon Attack:* +17 to hit, reach 5 ft., one target. *Hit:* 20 (3d6 + 7 + 3) energy damage.
          Mand'alor gains +3 to attack and damage rolls made with this enhanced lightsaber (included). This weapon
          ignores resistance to energy damage. When Mand'alor attacks a creature that has at least one head with this
          weapon and rolls a 20 on the attack roll, they cut off one of the creature’s heads. The creature dies if it
          can’t survive without the lost head. A creature is immune to this effect if it is immune to energy damage,
          doesn’t have or need a head, has legendary actions, or the GM decides that the creature is too big for its
          head to be cut off with this weapon. Such a creature instead takes an extra 21 (6d6) energy damage from the
          hit.</p>
