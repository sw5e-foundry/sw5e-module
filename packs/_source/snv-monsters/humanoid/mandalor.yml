          with tech powers). It has 60 tech points and knows the following tech powers:<br>At-will: *assess the
          situation, encrypted message, kolto pack, temporary boost*<br><br>1st-level: *energy shield, flame sweep,
          flash, spot the weakness, tactical barrier, tranquilizer*<br><br>2nd-level: *detect invisibility, electromesh,
          shared shielding, smuggle*<br><br>3rd-level: *explosion, kolto cloud, tactical advantage, tech
          overide*<br><br>4th-level: *ballistic shield, defibrillate, kolto reserve, scan area*<br><br>5th-level:
          *immolate, paralyze creature*<br><br>6th-level: *disperse energy, firestorm*<br><br>7th-level: *greater
          sabotage charges, tactical superiority*</p>
