          total is how many hit points of creatures this power can affect. Creatures within 20 feet of the point are
          affected in ascending order of their current hit points (ignoring unconscious creatures).</p>

          <p>Starting with the creature that has the lowest current hit points, each creature affected by this power is
          blinded until the end of your next turn. Subtract each creature's hit points from the total before moving on
          to the creature with the next lowest hit points. A creature's hit points must be equal to or less than the
          remaining total for that creature to be affected.</p>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 2nd level or
          higher, roll an additional [[/r 2d10]] for each slot level above 1st.</p>
