    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/Cage.webp
    system:
      description:
        value: >-
          <p>An immobile, invisible, cube-shaped prison composed of energy springs into existence around an area you
          choose within range. The prison can be a cage or a solid box as you choose.</p>

          <p>A prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars
          spaced 1/2 inch apart.</p>

          <p>A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any
          matter from passing through it and blocking any powers cast into or out of the area.</p>

          <p>When you cast the power, any creature that is completely inside the cage's area is trapped. Creatures only
          partially within the area, or those too large to fit inside the area, are pushed away from the center of the
          area until they are completely outside the area.</p>

          <p>A creature inside the cage can't leave it by unenhanced means. If the creature tries to teleport to leave
          the cage, it must first make a Charisma saving throw. On a success, the creature can use that power to exit
          the cage. On a failure, the creature can't exit the cage and wastes the use of the power or effect. </p>

          <p>This power can't be dispelled.</p>
