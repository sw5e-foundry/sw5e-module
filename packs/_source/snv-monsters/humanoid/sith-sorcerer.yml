    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The sorcerer is an 11th-level forcecaster. Its forcecasting ability is Charisma (force save DC 16, +8 to
          hit with force powers). It has 49 force points and knows the following force powers:<br>At-will: *force
          push/pull, saber reflect, saber ward, shock, slow*<br><br>1st-level: *battle precognition, disperse force,
          force reflect, sap vitality*<br><br>2nd-level: *affliction, drain vitality, hallucination,
          phasewalk*<br><br>3rd-level: *dark aura, force lightning, plague*<br><br>4th-level: *dominate beast, shocking
          shield*<br><br>5th-level: *dominate mind, improved force scream, improved phasewalk, insanity, siphon
          life*<br><br>6th-level: *force chain lightning, wrack*<br></p>
