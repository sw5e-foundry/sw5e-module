        value: >-
          <p><em><strong>Prerequisite</strong>: Saber Ward</em></p>

          <p>This power absorbs damage from certain incoming attacks, lessening its effect on you and distributing it
          throughout your body. You have resistance to the triggering damage type until the start of your next turn.
          Also, you gain 5 temporary hit points to potentially absorb the attack. These temporary hit points last until
          the start of your next turn.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 2nd level or
