        value: >-
          <p>The aquatic jedi master can enter this frenetic stance as a bonus action. When the aquatic jedi master hits
          a creature with a melee weapon attack, that creature has disadvantage on the first attack roll it makes
          against the aquatic jedi master before the start of the aquatic jedi master's next turn. Additionally, if the
          creature is within 5 feet of the aquatic jedi master, it must make a DC 19 Strength saving throw. On a
          failure, that creature is pushed back 5 feet, and the aquatic jedi master can move to enter the space the
          creature just vacated without provoking opportunity attacks.</p>
