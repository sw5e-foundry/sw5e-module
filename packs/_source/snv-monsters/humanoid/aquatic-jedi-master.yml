        value: >-
          <p><em><strong>Prerequisite</strong>: Sense Force</em></p>

          <p>You shift your vision to see through use of the Force; colors fade and inanimate objects appear as shades
          of gray. For the duration, you gain the following benefits.</p>

          <ul>

          <li>Living things glow with the power of the Force. Those with an affinity for the light side glow blue, those
          with an affinity for the dark side glow red, and those with no attunement to either side of the Force glow
          yellow. How bright they glow is determined by how strong their connection to the Force is.</li>

          <li>You gain blindsight to 30 feet.</li>

          <li>You have advantage on Wisdom (Perception) checks that rely on sight against living targets within 30
          feet.</li></ul>
