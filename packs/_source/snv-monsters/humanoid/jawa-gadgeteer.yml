    system:
      description:
        value: >-
          <p>This small incendiary device burns rapidly and releases choking smoke in a 20-foot sphere. The area is
          heavily obscured. Any breathing creature that’s in the affected area when the cloud is created or that starts
          its turn in the cloud is poisoned. Once a poisoned creature leaves the cloud, it makes a DC 13 Constitution
          saving throw at the end of its turns, ending the poisoned condition on a success. The smoke dissipates after
          10 minutes, or after 1 round in a strong wind.</p>
