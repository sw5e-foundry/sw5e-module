    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Spare the Dying</em></p>

          <p>You return a dead creature you touch to life, provided that it has been dead no longer than 10 minutes. If
          the creature's soul is both willing and at liberty to rejoin the body, the creature returns to life with 1 hit
          point. This power has no effect on droids or constructs.</p>

          <p>This power also neutralizes any poisons and cures diseases that affected the creature at the time it died.
          </p>

          <p>This power closes all mortal wounds, but it doesn't restore missing body parts. If the creature is lacking
          body parts or organs integral for its survivalâ€"its head, for instanceâ€"the power automatically fails.</p>

          <p>Coming back from the dead is an ordeal. The target takes a -4 penalty to all attack rolls, saving throws,
          and ability checks. Every time the target finishes a long rest, the penalty is reduced by 1 until it
          disappears. </p>
