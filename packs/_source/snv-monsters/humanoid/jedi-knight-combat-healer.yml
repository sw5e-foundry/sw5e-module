    system:
      description:
        value: >-
          <p>The healer is a 10th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 17, +9 to hit
          with force powers). It has 45 force points and knows the following force powers:<br>At-will: *force push/pull,
          give life, guidance, mind trick, saber reflect, saber ward, spare the dying*<br><br>1st-level: *battle
          precognition, breath control, disperse force, force body, force mask, force reflect, heal, heroism, project,
          sanctuary*<br><br>2nd-level: *force barrier, force blur, phasewalk, rescue, restoration, stun, vitality
          shield*<br><br>3rd-level: *beacon of hope, force repulse, remove curse, sever force, share life*<br>
          <br>4th-level: *aura of purity, force immunity, freedom of movement*<br><br>5th-level: *control pain, improved
          force barrier, improved heal, revitalize, stasis*<br></p>
