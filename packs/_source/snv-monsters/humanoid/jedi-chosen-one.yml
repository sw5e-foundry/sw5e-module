    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Knight Speed</em></p>

          <p>Choose up to two willing creatures that you can see within range. Until the power ends, each targets' speed
          is doubled, they gain a +2 bonus to AC, they have advantage on Dexterity saving throws, and they gain an
          additional action on each of their turns. That action can be used only to take the Attack (one weapon attack
          only), Dash, Disengage, Hide, or the Use an Object Action. </p>

          <p>When the power ends, each target can't move or take actions until after its next turn, as a wave of
          lethargy sweeps over it.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 8th-level or
          higher, you can target one additional creature for each slot level above 7th.</p>
