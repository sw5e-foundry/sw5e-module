    system:
      description:
        value: >-
          <p>The healer is a 9th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 17, +9 to hit with
          force powers). It has 41 force points and knows the following force powers:<br>At-will: *force push/pull,
          force technique, give life, saber reflect, saber ward, spare the dying, turbulence*<br><br>1st-level: *battle
          precognition, disperse force, force body, force reflect, heal, heroism, project, sanctuary*<br><br>2nd-level:
          *battle meditation, force barrier, force enlightenment, phasewalk, restoration, stun*<br><br>3rd-level:
          *beacon of hope, knight speed, remove curse, sever force, share life, telekinetic storm*<br><br>4th-level:
          *aura of purity*<br><br>5th-level: *improved battle meditation, improved force barrier, improved heal,
          improved restoration, revitalize, stasis*<br></p>
