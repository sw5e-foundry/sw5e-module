    name: Forcecasting
    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The rebel is a 8th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 15, +7 to hit with
          force powers. It has 36 force points and knows the following force powers: <br><br>At-will: *force push/pull,
          mind trick, saber reflect, saber ward, turbulence* <br><br>1st-level: *battle precognition, burst of speed,
          disperse force, force jump, force reflect, heal, project* <br><br>2nd-level: *battle meditation, force
          confusion, force throw, phasewalk, stun* <br><br>3rd-level: *knight speed, sever force, telekinetic storm*
          <br><br>4th-level: *freedom of movement, mind trap* <br><br>5th-level: *telekinesis* <br></p>
