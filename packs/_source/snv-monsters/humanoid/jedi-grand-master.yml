          <p>The jedi grand master is a 20th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 24,
          +16 to hit with force powers). It has 88 force points and knows the following force powers:<br>At-will: *force
          disarm, force push/pull, force technique, give life, saber reflect, saber throw, saber ward*<br><br>1st-level:
          *battle precognition, burst of speed, disperse force, force jump, force reflect, force throw, heal, heroism,
          propel, saber assault, sanctuary*<br><br>2nd-level: *animate weapon, battle meditation, danger sense,
          phasewalk, stun, stun droid*<br><br>3rd-level: *call lightning, knight speed, sever force, share life,
          telekinetic storm*<br><br>4th-level: *disable droid, force immunity, freedom of movement, mind
          trap*<br><br>5th-level: *improved battle meditation, improved heal, improved phasestrike, improved phasewalk,
          mass animation, revitalize, skill empowerment, telekinesis*<br><br>6th-level: *greater heal, telekinetic
          burst, true sight, wall of light*<br><br>7th-level: *destroy droid, force mend, improved revitalize, master
          speed*<br> <br>8th-level: *earthquake, force link, mind blank, telekinetic wave*<br><br>9th-level: *master
          battle meditation, master heal, master revitalize, precognition, will of the force*<br></p>
