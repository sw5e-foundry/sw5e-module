  - _id: eb250da278cf8664
    name: Will of the Force
    type: spell
    img: modules/sw5e-module/icons/packs/Force%20Powers/WillOfTheForce.webp
    effects: []
    folder: null
    sort: 0
    flags:
      sw5e-importer:
        timestamp: "2023-03-09T01:51:59.1297585+00:00"
        importer_version: 3
        uid: Power.name-will_of_the_force.level-9
      dnd5e:
        riders:
          activity: []
          effect: []
      core:
        sourceId: Compendium.sw5e-module.powers-maneuvers.Item.FZG3x9UyFmNU6gma
      sw5e:
        snvMonsters:
          embeddedFromCanonical: true
          canonicalCastType: force
          canonicalCompendium: sw5e-module.powers-maneuvers
          canonicalName: Will of the Force
          sourceSemanticKey: snv:Humanoids (Force Users):jedi-grand-master
          tierLabel: 9th-level
          tierKind: leveled
          overrides: []
    system:
      description:
        value: >-
          <p>You sublimate yourself before the will of the Force, attempting to use it to affect change in the galaxy
          around you. </p>

          <p>The basic use of this power is to duplicate any other light side or universal force power of 8th level or
          lower. You don't need to meet any requirements in that power; it simply takes effect. Alternatively, you can
          create one of the following effects of your choice:</p>

          <ul>

          <li>You summon one object to you of up to 250,000 cr in value that isn't an enhanced item. The object can be
          no more than 300 feet in any dimension, and it appears in an unoccupied space you can see on the ground.</li>

          <li>You allow up to twenty creatures that you can see to regain all hit points, and you end all effects on
          them described in the <em>improved restoration</em> power.</li>

          <li>You grant up to ten creatures that you can see resistance to a damage type you choose.</li>

          <li>You grant up to ten creatures you can see immunity to a single power or other specific enhanced effect for
          8 hours. For instance, you could make yourself and all your companions immune to the Manifestation of
          Abeloth's Will ability.</li>

          <li>You undo a single recent event by forcing a reroll of any roll made within the last round (including your
          last turn). Reality reshapes itself to accommodate the new result. For example, <em>will of the force</em>
          could undo an opponent's successful save, a foe's critical hit, or a friend's failed save. You can force the
          reroll to be made with advantage or disadvantage, and you can choose whether to use the reroll or the original
          roll.</li>

          </ul>

          <p>You might be able to achieve something beyond the scope of the above examples. State your wish to the DM as
          precisely as possible. The DM has great latitude </p>

          <p>in ruling what occurs in such an instance; the greater the wish, the greater the likelihood that something
          goes wrong. This power might simply fail, the effect you desire might only be partly achieved, or you might
          suffer some unforeseen consequence as a result of how you worded the wish. For example, wishing that a villain
          were dead might propel you forward in time to a period when that villain is no longer alive, effectively
          removing you from the game. Similarly, wishing for a legendary enhanced item or artifact might instantly
          transport you to the presence of the item's current owner.</p>

          <p>The stress of casting this power to produce any effect other than duplicating another power weakens you.
          After enduring that stress, each time you cast a power until you finish a long rest, you take [[/r 1d10]]
          necrotic damage per level of that power, which can't be reduced or prevented in any way. Additionally, your
          Strength drops to 3, if it isn't 3 or lower already, for [[/r 2d4]] days. For each of those days that you
          spend resting and doing nothing more than light activity, your remaining recovery time decreases by 2 days.
          Additionally, there is a 33 percent chance that you are unable to cast <em>will of the force</em> ever again
          if you suffer this stress. Finally, if you are reduced to 0 hit points as a result of this necrotic damage, or
          at any point before you have fully recovered from the Strength reduction, you immediately die and cannot be
          resurrected as your body fades away, absorbed into the living Force.</p>
        chat: ""
