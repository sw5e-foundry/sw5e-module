    system:
      description:
        value: >-
          <p>As you align yourself with nature through the Force, a 10-foot tall, 60-foot radius storm cloud cylinder
          appears, centered on a point you can see within range above you, with you as the center point. The power fails
          if your location can't accommodate the cloud's size or height. When you cast the power, choose a point under
          the cloud for lightning to strike. Each creature within 5 feet must make a Dexterity save, taking [[/r 3d10]]
          lightning damage on a fail and half on a success. While the power persists, you can use your action to call
          lightning to a point in range again.</p>

          <p>If you're outdoors and in a storm, the power gives you control of the storm rather than creating a new one.
          The lightning damage also increases by [[/r 1d10]].</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 4th level or
          higher, the damage increases by [[/r 1d10]] for each slot level above 3rd.</p>
