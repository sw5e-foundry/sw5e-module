    system:
      description:
        value: >-
          <p>You create a 20-foot-radius sphere of poisonous, yellow-green fog centered on a point you choose within
          range. The fog spreads around corners. It lasts for the duration or until strong wind disperses the fog,
          ending the power. Its area is heavily obscured.</p>

          <p>When a creature enters the power's area for the first time on a turn or starts its turn there, that
          creature must make a Constitution saving throw. The creature takes [[/r 5d8]] poison damage on a failed save,
          or half as much damage on a successful one. Creatures are affected even if they hold their breath or don't
          need to breathe.</p>

          <p>The fog moves 10 feet away from you at the start of each of your turns, rolling along the surface of the
          ground. The vapors, being heavier than air, sink to the lowest level of the land, even pouring down
          openings.</p>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 6th level or
          higher, the damage increases by [[/r 1d8]] for each slot level above 5th.</p>
