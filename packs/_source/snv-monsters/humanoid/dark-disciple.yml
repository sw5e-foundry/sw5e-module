          <p>You can use a bonus action while the target is paralyzed to move the target up to 10 feet in any
          direction.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 7th level or
          higher, the damage increases by [[/r 1d8]] for each slot level above 6th.</p>
