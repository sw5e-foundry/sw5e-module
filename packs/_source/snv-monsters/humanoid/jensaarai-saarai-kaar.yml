          hit with force powers). It has 49 force points and knows the following force powers:<br>At-will: *force
          disarm, force pull/push, saber reflect*<br><br>1st-level: *force jump, force throw,
          phasestrike*<br><br>2nd-level: *animate weapon, force camouflage, phasewalk*<br><br>3rd-level: *knight speed,
          sever force, telekinetic storm*<br><br>4th-level: *improved force camouflage*<br><br>5th-level: *improved
          phasestrike, improved phasewalk, mass animation*<br></p>
