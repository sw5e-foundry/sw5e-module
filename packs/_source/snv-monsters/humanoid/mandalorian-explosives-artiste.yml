          receive visual information from the probe. It has darkvision out to 30 feet. The eye can look in every
          direction.</p>

          <p>As an action, you can move the probe up to 30 feet in any direction. There's no limit on how far away from
          you it can be. A solid barrier blocks the probe's movement, but it can pass through an opening at least 1 inch
          in diameter.</p>
