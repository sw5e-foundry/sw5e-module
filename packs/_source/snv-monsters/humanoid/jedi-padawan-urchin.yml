    system:
      description:
        value: >-
          <p>The urchin is a 4th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 13, +5 to hit with
          force powers). It has 19 force points and knows the following force powers: <br>At-will: *force push/pull,
          force technique, mind trick, saber reflect, saber ward, turbulence* <br><br>1st-level: *battle precognition,
          breath control, force jump, heal, phasestrike, project*<br><br>2nd-level: *battle meditation, force confusion,
          phasewalk* <br></p>
