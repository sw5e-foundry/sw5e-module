          20-foot-radius sphere centered on that point must make an Intelligence saving throw. A creature with an
          Intelligence score of 2 or lower can't be affected by this power. A target takes [[/r 8d6]] psychic damage on
          a failed save, or half as much damage on a successful one.</p>

          <p>After a failed save, a target has muddled thoughts for 1 minute. During that time, it rolls a [[/r d6]] and
