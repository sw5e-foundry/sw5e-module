    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Force Push/Pull</em></p>

          <p>Choose one or more creatures or objects not being worn or carried within 60 feet that weigh up to a
          combined total of 15 pounds. The creatures or objects immediately move 60 feet in a direction of your choice.
          If the creatures or objects end this movement in the air, they immediately fall to the ground. If the
          creatures or objects collide with any one target during its travel, both the creatures or objects and the
          target take [[/r 3d8]] kinetic damage. If the target is a creature, it must make a Dexterity saving throw. On
          a failed save, it takes the kinetic damage, or half as much on a successful one.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 2nd level or
          higher, the maximum weight increases by 15 pounds and the damage increases by [[/r 1d8]] for each slot level
          above 1st.</p>
