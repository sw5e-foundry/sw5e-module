    name: Forcecasting
    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The jedi vaapad master is a 17th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 21,
          +13 to hit with force powers). It has 74 force points and knows the following force powers:<br>At-will:
          *battle insight, force disarm, force push/pull, force technique, saber reflect, saber throw, saber
          ward*<br><br>1st-level: *burst of speed, disperse force, force jump, force reflect, force throw, slow
          descent*<br><br>2nd-level: *animate weapon, sense shatterpoint, stun, stun droid*<br><br>3rd-level: *knight
          speed, sever force, telekinetic shield, telekinetic storm*<br><br>4th-level: *force immunity, freedom of
          movement*<br><br>5th-level: *improved phasestrike, mass animation, reveal shatterpoint,
          telekinesis*<br><br>6th-level: *crush, telekinetic burst*<br><br>7th-level: *destroy droid, master
          speed*<br></p>
        chat: ""
