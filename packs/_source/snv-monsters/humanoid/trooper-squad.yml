  - type: feat
    system:
      description:
        value: >-
          <p>The squad fires *en masse* at a point within 150 feet. Each creature of the squad's choice in a 10-foot
          radius sphere centered on that point must make a DC 14 Dexterity saving throw. On a failed save, a creature
          takes 36 (8d8) energy damage, or 18 (4d8) energy damage if the squad has half its hit points or fewer. On a
          successful save, it takes half as much damage. \pagebreakNum ___</p>
        chat: ""
      type:
        value: ""
        subtype: ""
      activities: {}
