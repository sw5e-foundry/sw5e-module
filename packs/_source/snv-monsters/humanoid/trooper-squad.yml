          <p>Weapons with this property are fueled by power cells, which must be loaded in order to fire the weapon. A
          power cell fuels a number of attacks equal to the weapon's reload number.</p>

          <h3>Reload 12</h3>

          <p>A number of shots equal to the reload number can be made with a weapon with this property. A character must
          then reload it using an action or a bonus action (their choice). You must have one free hand to reload.</p>

