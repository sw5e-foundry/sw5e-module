        value: >-
          <p>You point your finger toward a creature within range that possesses a commlink and whisper a message. The
          target (and only the target) hears the message and can send an encrypted reply that only you can hear. These
          messages cannot be intercepted or decrypted by unenhanced means.</p>

          <p>You can cast this power through solid objects if you are familiar with the target and know it is beyond the
          barrier. 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood blocks the power.
          The power doesn't have to follow a straight line and can travel freely around corners or through openings.</p>
