    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/WireTow.webp
    system:
      description:
        value: >-
          <p>You project a length of wire towards a foe to bring them within your grasp. Make a ranged tech attack
          against the target. On a hit, the target takes [[/r 2d10]] kinetic damage, and you can pull it up to 25 feet
          closer to you. If you score a critical hit, the target is also knocked prone. If the target ends this movement
          within 5 feet of you and is no more than one size larger than you, the target is grappled by you for the
          duration.</p>

          <p>If a creature you grapple with this power uses its action to escape, it must succeed on a Strength
          (Athletics) or Dexterity (Acrobatics) check against your tech save DC to do so.</p>

          <p>This power ends if the attack misses or the grapple ends.</p>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 3rd level or
          higher, the damage increases by [[/r 1d10]] for each slot level above 2nd.</p>
        chat: ""
