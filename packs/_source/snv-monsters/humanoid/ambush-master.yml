          within your weapon's range, otherwise the power fails. On a hit, the target suffers the attack's normal
          effects, and each Large or smaller creature within 10 feet of the target must succeed on a Strength saving
          throw or be pulled to the nearest unoccupied space adjacent to the target. </p>

          <p>This power deals additional damage when you reach higher levels. At 5th level, the ranged attack deals an
