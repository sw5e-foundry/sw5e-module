    system:
      description:
        value: >-
          <p>The tusken generates a blast of hot wind in a 30-foot line or a 15-foot cone. Creatures inside it take 14
          (4d6) kinetic damage plus 7 (2d6) fire damage and are blinded for 1 minute; a successful DC 14 Constitution
          saving throw halves the damage and negates the blindness. A blinded creature repeats the saving throw at the
          end of each of its turns, ending the effect on itself on a success. The affected area (line or cone) is
          heavily obscured until the end of the tusken's next turn.</p>
