    system:
      description:
        value: >-
          <p>When the tusken attacks a creature with a weapon attack, it can roll a d4 and add the number rolled to the
          attack roll. On a hit, the target takes additional damage equal to the roll. Hit or miss, the tusken can
          choose either itself or an ally within 15 feet of it that it can see. The creature regains hit points equal to
          1 + the number rolled, and temporary hit points equal to 1 + the number rolled.</p>
