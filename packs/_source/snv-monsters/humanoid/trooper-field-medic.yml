          of metal. On a hit, the target takes [[/r 1d8]] lightning damage and becomes shocked until the start of its
          next turn.</p>

          <p>This power's damage increases by [[/r 1d8]] when you reach 5th level ([[/r 2d8]]), 11th level ([[/r 3d8]]),
