        value: >-
          <p>The inquisitor is an 11th-level forcecaster. Its forcecasting ability is Charisma (force save DC 16, +8 to
          hit with force powers). It has 49 force points and knows the following force powers:<br>At-will: *denounce,
          force disarm, force push/pull, mind trick, saber throw, slow* <br><br>1st-level: *dark side tendrils, force
          jump, sap vitality, sense force* <br><br>2nd-level: *animate weapon, drain vitality, force sight, improved
          saber throw, stun* <br><br>3rd-level: *choke, force suppression, improved dark side tendrils, sever force*
          <br><br>4th-level: *drain life* <br><br>5th-level: *greater saber throw* <br></p>
