          hit with tech powers). It has 40 tech points and knows the following tech powers: <br>At-will: *assess the
          situation, electrical burst, electroshock, minor hologram, ward*<br><br>1st-level: *alarm, decryption program,
          energy shield, hologram, overload, repair droid*<br><br>2nd-level: *detect invisibility, hold droid, mirror
          image, translocate*<br><br>3rd-level: *diminish tech, greater hologram, scramble interface, tech
          override*<br><br>4th-level: *ballistic shield, synchronicity*<br><br>5th-level: *override interface*<br></p>
