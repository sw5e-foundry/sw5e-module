    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/GreaterHologram.webp
    system:
      description:
        value: >-
          <p>You create an image no larger than a 20 foot cube. It appears at a spot you can see and lasts for the
          duration. It seems completely real, sounds and other sensory effects included. You can't create a sensory
          effect strong enough to cause damage or a condition.</p>

          <p>As long as you are within range of the illusion, you can use your action to make the image to move to any
          other spot within range. As the image changes location, you can alter it so that its movements appear natural
          for the image.</p>

          <p>Physical interaction with the image reveals it as an illusion. A creature can use its action to determine
          that it's an illusion with a successful Investigation check. If a creature learns it's an illusion, it can see
          through the image, and the other sensory qualities become faint to it.</p>

          <p><strong><em>Overcharge Tech.</em></strong> The power lasts until dispelled without requiring concentration
          if cast at 6th-level or higher.</p>
