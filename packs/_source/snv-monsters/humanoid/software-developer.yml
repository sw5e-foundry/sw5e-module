    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/Synchronicity.webp
    system:
      description:
        value: >-
          <p>A creature you touch isn't inconvenienced by mundane delays. Traffic lights are always green, there's
          always a waiting elevator, and a taxi is always around the corner. The target can run at full speed through
          dense crowds and attacks of opportunity provoked by the target's movement are made with disadvantage.</p>

          <p>The power also grants advantage to stealth checks, since cover is always available. Additionally, the
          target has advantage on all ability checks made to drive a vehicle.</p>

          <p>If two or more creatures under the effect of the power are attempting to avoid being inconvenienced by each
          other, the creatures make Charisma checks each time the effects would oppose each other. The higher check of
          the two's power takes effect.</p>
