      description:
        value: >-
          <p>You choose one droid or construct you can see within range and scramble its ability to differentiate
          targets. The target must make an Intelligence saving throw. If the construct has the 'Piloted' trait, and has
          a pilot controlling it that is not incapacitated, it gains a bonus to the saving throw equal to the pilot's
          Intelligence modifier. On a failed save, the target loses the ability to distinguish friend from foe,
          regarding all creatures it can see as enemies until the power ends. Each time the target takes damage, it can
          repeat the saving throw, ending the effect on itself on a success.</p>

          <p>Whenever the affected creature chooses another creature as a target, it must choose the target at random
          from among the creatures it can see within range of the attack, power, or other ability it's using. If an
          enemy provokes an opportunity attack from the affected creature, the creature must make that attack if it is
          able to.</p>
