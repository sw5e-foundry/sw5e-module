    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Saber Ward</em></p>

          <p>The first time you take the Attack action during your turn, you can simultaneously cast this power to blend
          your melee weapon attacks with the use of the Force. For each successful hit you make with a melee weapon
          before the power ends, the target must make a Dexterity saving throw or have a new effect apply until the end
          of its next turn. Once you've made three weapon attacks, the power ends.</p>

          <ul>

          <li><strong>1st Hit:</strong> If the target fails its saving throw, it gains 1 slowed level until the end of
          its next turn.</li>

          <li><strong>2nd Hit:</strong> If the target fails its saving throw, it takes [[/r 1d6]] kinetic damage and
          cannot take reactions until after the end of its next turn.</li>

          <li><strong>3rd Hit:</strong> If the target fails its saving throw, it takes [[/r 2d6]] kinetic damage and
          cannot take bonus actions during its next turn.</li>

          </ul>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 3rd level or
          higher, the damage of the second and third hit each increase by [[/r 1d6]] for every two slot levels above
          1st.</p>
