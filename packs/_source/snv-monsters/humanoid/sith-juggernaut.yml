          The darkness spreads around corners. A creature with darkvision can't see through this darkness, and
          unenhanced light can't illuminate it.</p>

          <p>If the point you choose is on an object you are holding or one that isn't being worn or carried, the
          darkness comes from the object and moves with it. Completely covering the source of the darkness with an
