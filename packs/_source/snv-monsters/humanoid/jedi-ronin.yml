    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Guidance</em></p>

          <p>You touch a creature and enhance it with the Force. Choose one of the following effects; the target gains
          that effect until the power ends.</p>

          <ul>

          <li><strong><em>Strength.</em></strong> The target has advantage on Strength checks, and his or her carrying
          capacity doubles.</li>

          <li><strong><em>Dexterity.</em></strong> The target has advantage on Dexterity checks. It also doesn't take
          damage from falling 20 feet or less if it isn't incapacitated.</li>

          <li><strong><em>Endurance.</em></strong> The target has advantage on Constitution checks. It also gains [[/r
          2d6]] temporary hit points, which are lost when the power ends.</li>

          <li><strong><em>Cunning.</em></strong> The target has advantage on Intelligence checks.</li>

          <li><strong><em>Wisdom.</em></strong> The target has advantage on Wisdom checks.</li>

          <li><strong><em>Splendor.</em></strong> The target has advantage on Charisma checks.</li>

          </ul>

          <p>This power has no effect on droids or constructs.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 3rd level or
          higher, you can target one additional creature for each slot level above 2nd.</p>
