    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The jedi ronin is a 14th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 19, +11 to
          hit with force powers). It has 61 force points and knows the following force powers:<br>At-will: *force
          disarm, force push/pull, force technique, guidance, mind trick, saber reflect, saber ward*<br><br>1st-level:
          *battle precognition, burst of speed, disperse force, force jump, force reflect, heroism, saber assault, sense
          force, slow descent*<br><br>2nd-level: *animate weapon, battle meditation, force enlightenment, force sight,
          force throw, rescue, stun droid*<br><br>3rd-level: *force repulse, knight speed, remove curse, telekinetic
          shield*<br><br>4th-level: *disable droid, force immunity, freedom of movement*<br><br>5th-level:
          *telekinesis*<br> <br>6th-level: *true sight*<br><br>7th-level: *destroy droid*<br></p>
