          burst, electroshock, jet of flame, poison spray, ward*<br><br>1st-level: *absorb energy, cryogenic blast,
          energy shield, oil slick, smoke cloud*<br><br>2nd-level: *darkvision, mirror image, pyrotechnics,
          shatter*<br><br>3rd-level: *dimish tech, explosion, sending, tech override*<br><br>4th-level: *ballistic
          shield, holding cell, kolto reserve*<br><br>5th-level: *cryogenic spray, friendly fire,
          shutdown*<br><br>6th-level: *disintegrate, kolto infusion*<br><br>7th-level: *tactical
