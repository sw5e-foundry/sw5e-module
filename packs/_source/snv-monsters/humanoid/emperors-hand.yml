    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/HolographicDisguise.webp
    system:
      description:
        value: >-
          <p>Until the power ends or you use an action to dismiss it, you can disguise yourself through the use of a
          hologram emitter. You can appear to be shorter or taller by about a foot and change the appearance of your
          body weight, but you cannot change the basic structure of your body. The hologram can include your clothes,
          armor, weapons, and other belongings on your person. </p>

          <p>The illusion is only visual, so any sort of physical contact will only interact with the real size and
          shape of you. A creature can use its action to make an Intelligence (Investigation) check against your tech
          save DC, seeing through the hologram on a success.</p>
