        value: >-
          <p>The nightsister is a 9th-level forcecaster. Its forcecasting ability is Charisma (force save DC 15, +7 to
          hit with force powers). It has 40 force points and knows the following force powers:<br>At-will: *affect mind,
          enfeeble, force push/pull, slow*<br><br>1st-level: *dark side tendrils, fear, force mask, hex, sap vitality,
          wound*<br><br>2nd-level: *affliction, dark shear, darkness, drain vitality, force camouflage, hallucination,
          mindspike, phasewalk*<br><br>3rd-level: *bestow curse, dark aura, horror, improved dark side tendrils,
          plague*<br><br>4th-level: *dominate beast, drain life, hysteria, improved force camouflage, shroud of
          darkness*<br><br>5th-level: *dominate mind, improved phasewalk, insanity, siphon life*<br></p>
