          are familiar with on the same planet. If you name a destination that moves (such as a mobile fortress), or a
          destination that isn't specific (such as "a Black Sun lair"), the power fails.</p>

          <p>For the duration, as long as you are on the same planet as the destination, you know how far it is and in
          what direction it lies. While you are traveling there, whenever you are presented with a choice of paths along
          the way, you automatically determine which path is the shortest and most direct route (but not necessarily the
          safest route) to the destination.</p>
