  - _id: 32fa807289742ce4
    name: Explosive Chems (Recharge 5-6)
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3e-p2-hum
          recharge:
            family: recharge
            min: 5
            max: 6
            runtimeAutomation: true
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The jawa throws a flask of volatile substances at a point within 30 feet. The flask explodes in a 15-foot
          radius. Creatures in the area must make a DC 13 Dexterity saving throw. On a failure a creature takes 17 (5d6)
          poison damage and is poisoned for 1 minute, on a success it takes half damage and is not poisoned. A poisoned
          creature repeats the saving throw at the end of each of its turns, ending the poisoned condition on a success.
          Instead of poison damage, the jawa can deal the damage type currently in effect for its Apothecary trait.</p>
        chat: ""
