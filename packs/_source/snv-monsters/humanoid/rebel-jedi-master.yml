          <p>The jedi master is a 16th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 20, +12 to
          hit with force powers). It has 70 force points and knows the following force powers: <br>At-will: *force
          disarm, force push/pull, give life, guidance, saber reflect, saber ward, turbulence*<br><br>1st-level: *burst
          of speed, cloud mind, disperse force, force jump, force reflect, heal, project, valor*<br><br>2nd-level:
          *animate weapon, calm emotions, force barrier, force camouflage, force sight, force throw*<br><br>3rd-level:
          *beacon of hope, knight speed, sever force, telekinetic storm*<br><br>4th-level: *force immunity, improved
          force camouflage*<br><br>5th-level: *mass animation, telekinesis*<br><br>6th-level: *telekinetic burst*</p>
