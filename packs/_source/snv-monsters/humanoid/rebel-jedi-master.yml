          barrier moves with you. Any force power of 3rd level or lower cast from outside the barrier can't affect you,
          even if the power is cast using a higher level force slot. Such a power can target you, but the power has no
          effect on you. Similarly, the area within the barrier is excluded from the areas affected by such powers.</p>

