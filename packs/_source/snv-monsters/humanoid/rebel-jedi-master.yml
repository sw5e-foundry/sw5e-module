    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Sense Emotion</em></p>

          <p>You attempt to suppress strong emotions in a group of people. Each humanoid in a 20-foot-radius sphere
          centered on a point you choose within range must make a Charisma saving throw a creature can choose to fail
          this saving throw if it wishes. If a creature fails its saving throw, choose one of the following two
          effects.</p>

