      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Give Life</em></p>

          <p>You sacrifice some of your health to mend another creature's injuries. You take [[/r 4d8]] necrotic damage,
          and one creature of your choice that you can see within range regains a number of hit points equal to twice
          the necrotic damage you take. This power has no effect on droids or constructs.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 4th level or
          higher, the damage increases by [[/r 1d8]] for each slot level above 3rd.</p>
