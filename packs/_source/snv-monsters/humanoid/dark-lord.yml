          <p>The dark lord is an 18th-level forcecaster. Its forcecasting ability is Charisma (force save DC 18, +10 to
          hit with force powers). It has 77 force points and knows the following force powers:<br>At-will: *affect mind,
          denounce, force push/pull,  mind trick, saber reflect, saber ward, shock*<br><br>1st-level: *battle
          precognition, disperse force, force body, force reflect, hex*<br><br>2nd-level: *battle meditation, darkness,
          phasewalk*<br><br>3rd-level: *force lightning, force suppression, sever force*<br><br>4th-level: *dominate
          beast, force immunity, shocking shield*<br><br>5th-level: *improved battle meditation, improved phasewalk,
          telekinesis*<br><br>6th-level: *force chain lightning, improved force immunity*<br><br>7th-level: *force
          lightning cone*<br><br>8th-level: *master force immunity*<br><br>9th-level: *force storm*</p>
