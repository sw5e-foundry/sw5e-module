  - name: Tracker Droid Interface
    flags:
      sw5e-importer:
        timestamp: "2023-03-09T01:51:59.1907223+00:00"
        importer_version: 3
        uid: Power.name-tracker_droid_interface.level-1
      dnd5e:
        riders:
          activity: []
          effect: []
      core:
        sourceId: Compendium.sw5e-module.powers-maneuvers.Item.S4noupmsj7hvtdrD
      sw5e:
        snvMonsters:
          embeddedFromCanonical: true
          canonicalCastType: tech
          canonicalCompendium: sw5e-module.powers-maneuvers
          canonicalName: Tracker Droid Interface
          sourceSemanticKey: snv:Humanoids:exchange-gunslinger
          tierLabel: 1st-level
          tierKind: leveled
          overrides: []
    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/TrackerDroidInterface.webp
    system:
      description:
        value: >-
          <p>You interface a tracker droid with your tech focus, creating a permanent link. </p>

          <p>Your tracker droid acts independently of you, but it always obeys your commands. In combat, it acts on your
          turn.</p>

          <p>While your tracker droid is within 100 feet of you, you can communicate with it via your tech focus.
          Additionally, as an action, you can see through your droid's vision and hear what it hears until the start of
          your next turn, gaining the benefits of any special senses that the droid has. During this time, you are deaf
          and blind with regard to your own senses.</p>

          <p>You can't maintain an interface between more than one tracker droid and your tech focus at a time. </p>

          <p>Finally, when you cast a tech power with a range of touch, your tracker can deliver the power as if it had
          cast it. Your tracker droid must be within 100 feet of you, and it must use its reaction to deliver the power
          when you cast it. If the power requires an attack roll, you use your attack modifier for the roll.</p>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 3rd level or
          higher, you can maintain a link with one more tracker droid for every two slot levels above 1st. Multiple
          tracker droids act on the same initiative. You can only see through one droid's vision at a time, but you can
          toggle between droids as a bonus action. Each droid must still be within 100 feet of you.</p>
        chat: ""
