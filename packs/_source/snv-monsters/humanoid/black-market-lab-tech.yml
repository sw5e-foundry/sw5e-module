    system:
      description:
        value: >-
          <p>You create six tiny sabotage charges that last for the power's duration. When you cast the power, and as a
          bonus action on subsequent turns, you can hurl up to two of the charges to points you choose within 120 feet.
          Each charge explodes if it reaches the point or hits a solid surface. Each creature within 5 feet of the
          explosion must make a Dexterity save. The explosion deals [[/r 2d6]] fire damage on a failure, or half damage
          on a success.</p>

          <p><strong><em>Overcharge Tech.</em></strong> The number of charges created increases by two for each slot
          level above 3rd.</p>
