        value: >-
          <p>The peacekeeper is a 9th-level forcecaster. Its forcecasting ability is Wisdom (force save DC 15, +7 to hit
          with force powers). It has 39 force points and it knows the following force powers:<br>At-will: *force disarm,
          force push/pull, saber reflect, sonic charge, turbulence*<br><br>1st-level: *battle precognition, disperse
          force, force reflect, force throw, phasestrike*<br><br>2nd-level: *animate weapon, phasewalk, rescue,
          stun*<br><br>3rd-level: *knight speed, sever force, telekinetic storm*<br></p>
