    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>As a bonus action the tactician can analyze a target it can see within 90 feet. For the next minute, or
          until it analyzes another target, it gains the following benefits: After analyzing a hostile creature, the
          tactician can use its Intelligence modifier instead of Dexterity for attack and damage rolls against that
          creature. After analyzing a friendly creature, the target can end the tactician's Critical Analysis on them
          (no action required). The target then gains a +5 bonus that can be applied to one attack roll, ability check,
          or saving throw that the target makes.</p>
