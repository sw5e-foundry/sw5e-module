    system:
      description:
        value: >-
          <p>The usurper is an 18th-level forcecaster. Its forcecasting ability is Charisma (force save DC 21, +13 to
          hit with force powers). It has 70 force points and knows the following force powers:<br>At-will: *affect mind,
          denounce, force push/pull, mind trick, psychic charge, saber reflect, saber ward, shock*<br><br>1st-level:
          *battle precognition, burst of speed, dark side tendrils, disperse force, fear, force body, force reflect,
          hex, phasestrike, saber assault, wound*<br><br>2nd-level: *darkness, force camouflage, force confusion, force
          throw, hallucination, phasewalk, saber strike*<br><br>3rd-level: *dark aura, force scream, horror, improved
          dark side tendrils, knight speed, saber slash, sever <br>force*<br><br>4th-level: *dominate beast, force
          immunity, hysteria, improved force camouflage, mind trap, saber onslaught, shroud of
          darkness*<br><br>5th-level: *dominate mind, improved force scream, improved phasestrike, insanity,
          telekinesis*<br><br>6th-level: *improved force immunity*<br><br>7th-level: *ruin*<br><br>8th-level: *maddening
          darkness, master force immunity, master force scream, mind blank* <br><br>9th-level: *mass hysteria*</p>
