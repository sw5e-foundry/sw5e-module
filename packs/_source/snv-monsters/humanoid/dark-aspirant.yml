    system:
      description:
        value: >-
          <p>You imbue your weapon with debilitating force lightning. As part of the action used to cast this power, you
          must make a melee weapon attack against one creature within your reach, otherwise the power fails. On a hit,
          the target suffers the attack's normal effects, and the lightning leaps from the target to a different
          creature of your choice that you can see within 5 feet of it. The second creature takes lightning damage equal
          to your forcecasting ability modifier.</p>

          <p>This power's damage increases when you reach higher levels. At 5th level, the melee attack deals an extra
          [[/r 1d8]] lightning damage to the target, and the lightning damage to the second creature increases to [[/r
          1d8]] + your forcecasting ability modifier. Both damage rolls increase by [[/r 1d8]] at 11th level and 17th
          level.</p>
