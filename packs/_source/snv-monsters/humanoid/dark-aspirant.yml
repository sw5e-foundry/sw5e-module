          push/pull, lightning charge, saber reflect, saber ward, shock*<br><br>1st-level: *battle precognition, curse,
          disperse force, force reflect, hex, improved feedback, sap vitality*<br><br>2nd-level: *drain vitality, force
          camouflage*<br><br>3rd-level: *choke, force lightning, horror*<br></p>
