          Constitution saving throw or be poisoned for the duration. While poisoned in this way, the target is
          paralyzed. At the end of each of its turns, the target can make another Constitution saving throw. On a
          success, the power ends on the target.</p>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 3rd level or
          higher, you can target one additional humanoid for each slot level above 2nd. The humanoids must be within 30
          feet of each other when you target them.</p>
