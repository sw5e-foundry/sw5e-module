    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Greater Feedback</em></p>

          <p>You unleash the power of your mind to blast the intellect of up to ten creatures of your choice that you
          can see within range. Creatures that have an Intelligence score of 2 or lower are unaffected.</p>

          <p>Each target must make an Intelligence saving throw. On a failed save, a target takes [[/r 14d6]] psychic
          damage and is stunned. On a successful save, a target takes half as much damage and isn't stunned. </p>

          <p>A stunned target can make a Wisdom saving throw at the end of each of its turns. On a successful save, the
          stunning effect ends.</p>
