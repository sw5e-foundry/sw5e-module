        value: >-
          <p>The duelist is a 17th-level forcecaster. Its forcecasting ability is Charisma (force save DC 21, +13 to hit
          with force powers). It has 74 force points and knows the following force powers: <br>At-will: *denounce, force
          disarm, force push/pull, force technique, lightning charge, psychic charge, saber reflect, saber throw, saber
          ward, shock, sonic charge, turbulence*  <br>1st-level: *burst of speed, curse, disperse force, force jump,
          force reflect, hex, phasestrike, saber assault, slow descent* <br><br>2nd-level: *animate weapon, battle
          meditation, danger sense, force throw, saber strike, stun, stun droid* <br> <br>3rd-level: *bestow curse,
          choke, dark aura, force lightning, force repulse, saber slash, telekinetic shield, telekinetic
          storm*<br><br>4th-level: *freedom of movement, force immunity, saber onslaught, shocking shield*
          <br><br>5th-level: *improved phasestrike, mass animation, stasis, telekinesis* <br><br>6th-level: *force chain
          lightning, improved force immunity, telekinetic burst* <br><br>7th-level: *force lightning cone*
          <br><br>8th-level: *master force immunity, stasis field, telekinetic wave* <br><br>9th-level: *precognition*
          <br></p>
