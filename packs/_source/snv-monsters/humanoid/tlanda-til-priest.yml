    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The t'landa til emits a sonic vibration paired with an empathetic emission. Every humanoid and biological
          creature within 100 feet of the t'landa til must succeed on a DC 15 Wisdom saving throw or be charmed. Targets
          that cannot hear have advantage on the save. While charmed by the t'landa til, the target seeks to assist the
          t'landa til by any means within the target’s power and perspective (including attacking its enemies, and
          fulfilling its goals if these are known to the target). At the end of each of its turns or whenever the target
          takes damage from a source other than the t'landa til, the target can repeat the saving throw.</p>
        chat: ""
