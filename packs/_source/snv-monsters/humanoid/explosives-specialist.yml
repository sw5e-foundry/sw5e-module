    system:
      description:
        value: >-
          <p>After spending at least 30 seconds setting the charge, the specialist may attach the charge to a surface.
          The charge can be set with a 6-second timer, or detonated remotely using a remote detonator, which the
          specialist has. Once detonated, the breaching charge destroys an unenhanced section of wall up to 10 feet
          wide, 10 feet tall, and 5 feet deep. Additionally, each creature within 20 feet of the charge must make a DC
          14 Dexterity saving throw. A creature takes 10 (3d6) fire damage and 10 (3d6) kinetic damage on a failed save,
          or half as much on a successful one. A construct makes this save with disadvantage. If the breaching charge is
          installed on the construct, it automatically fails the saving throw.</p>
