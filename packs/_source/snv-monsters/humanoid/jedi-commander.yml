          mind, feedback, force disarm, force push/pull, mind trick, saber reflect, saber ward*   <br>1st-level: *burst
          of speed, disperse force, force jump, force reflect, force throw, heal, heroism, improved feedback, sense
          force, slow descent* <br><br>2nd-level: *calm emotions, coerce mind, force barrier, force enlightenment, force
          sight, rescue, restoration, stun droid*  <br>3rd-level: *force repulse, knight speed*   <br>4th-level:
