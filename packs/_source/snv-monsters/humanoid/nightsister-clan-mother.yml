    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Shroud of Darkness</em></p>

          <p>Terrifying darkness spreads from a point you choose within range to fill a 60-foot-radius sphere until the
          power ends. The darkness spreads around corners. A creature with darkvision can't see through this darkness.
          Unenhanced light, as well as light created by powers of 8th level or lower, can't illuminate the area.</p>

          <p>Shrieks, gibbering, and mad laughter can be heard within the sphere. Whenever a creature starts its turn in
          the sphere, it must make a Wisdom saving throw, taking [[/r 8d8]] psychic damage on a failed save, or half as
          much damage on a successful one.</p>
