    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Dominate Beast</em></p>

          <p>You attempt to beguile a humanoid that you can see within range. It must succeed on a Wisdom saving throw
          or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has
          advantage on the saving throw.</p>

          <p>While the target is charmed, you have a telepathic link with it as long as you are within 1 mile of it. You
          can use this telepathic link to issue commands to the creature while you are conscious (no action required),
          which it does its best to obey. You can specify a simple and general course of action, such as "Attack that
          creature," "Run over there," or "Fetch that object." If the creature completes the order and doesn't receive
          further direction from you, it defends and preserves itself to the best of its ability.</p>

          <p>You can use your action to take total and precise control of the target. Until the end of your next turn,
          the creature takes only the actions you choose, and doesn't do anything that you don't allow it to do. During
          this time you can also cause the creature to use a reaction, but this requires you to use your own reaction as
          well.</p>

          <p>Each time the target takes damage, it makes a new Wisdom saving throw against the power. If the saving
          throw succeeds, the power ends. </p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a 6th-level force slot, the
          duration is 10 minutes. When you use a 7th-level force slot, the duration is 1 hour. When you use a force slot
          of 8th level or higher, the duration is 8 hours.</p>
