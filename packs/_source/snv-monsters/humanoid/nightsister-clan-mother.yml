          force camouflage, hallucination, mind spike, phasewalk*<br><br>3rd-level: *bestow curse, dark aura, force
          lightning, horror, improved dark side tendrils, plague*<br><br>4th-level: *dominate beast, drain life, force
          immunity, hysteria, improved force camouflage, shroud of darkness*<br><br>5th-level: *dominate mind, improved
          phasewalk, insanity, siphon life*<br><br>6th-level: *eruption, force chain lightning, improved force immunity,
