  - _id: 98948510c01fba0e
    _key: "!actors.items!45b389098d625fd9.98948510c01fba0e"
    name: Forcecasting
    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The mastermind is a 20th-level forcecaster. Its forcecasting ability is Charisma (force save DC 24, +16 to
          hit with force powers). It has 88 force points and knows the following force powers: <br>At-will: *affect
          mind, force disarm, force push/pull, force whisper, saber reflect, saber ward, shock*<br><br>1st-level:
          *battle precognition, dark side tendrils, disperse force, fear, force reflect, hex, sap vitality, sustained
          lightning*<br><br>2nd-level: *battle meditation, coerce mind, darkness, drain vitality, force camouflage,
          hallucination*<br><br>3rd-level: *dark aura, force lightning, force suppression, horror, improved dark side
          tendrils, sever force*<br><br>4th-level: *dominate beast, drain life, hysteria, shocking shield, shroud of
          darkness* <br><br>5th-level: *dominate mind, force meld, improved battle meditation, insanity, siphon
          life*<br><br>6th-level: *force chain lightning, mass coerce mind*<br><br>7th-level: *force lightning cone,
          force project*<br><br>8th-level: *death field, force link, maddening darkness*<br><br>9th-level: *force storm,
          mass hysteria, master battle meditation*<br></p>
        chat: ""
