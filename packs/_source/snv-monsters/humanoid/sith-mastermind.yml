          <p>Terrifying darkness spreads from a point you choose within range to fill a 60-foot-radius sphere until the
          power ends. The darkness spreads around corners. A creature with darkvision can't see through this darkness.
          Unenhanced light, as well as light created by powers of 8th level or lower, can't illuminate the area.</p>

