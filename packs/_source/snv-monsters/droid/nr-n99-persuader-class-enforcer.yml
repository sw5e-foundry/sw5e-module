  - _id: 663bd44024799f60
    name: Crushing Stride
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3d-p1
    img: modules/sw5e-module/icons/packs/monsters/187_-_NR-N99_Persuader-Class_Enforcer/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The droid moves up to its speed in a straight line. During this move, it can enter Large or smaller
          creatures' spaces. A creature whose space the droid enters must make a DC 18 Dexterity saving throw. On a
          failed save, the creature falls prone and takes 36 (8d8) kinetic damage. On a successful save, the creature
          takes half damage and is pushed 5 feet to the nearest space out of the droid's path. If the droid ends its
          movement in a prone creature's space, the creature is also restrained until it's no longer in the same space
          as the droid. While restrained in this way, the creature, or another creature within 5 feet of it, can use an
          action to make a DC 18 Strength (Athletics) check. On a success, the creature is shunted to an unoccupied
          space of its choice within 5 feet of the droid and is no longer restrained.</p>
        chat: ""
      requirements: ""
