    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The droid has expertise in Charisma (Intimidation) checks. When the droid uses the attack action, it can
          replace one attack with an attempt to demoralize one humanoid it can see within 30 feet of it that can see and
          hear it. The droid makes a Charisma (Intimidation) check contested by the target’s Wisdom (Insight) check. If
          the check succeeds, the target is frightened until the end of the droid's next turn. If the check fails, the
          target can’t be frightened by the droid in this way for 1 hour.</p>
