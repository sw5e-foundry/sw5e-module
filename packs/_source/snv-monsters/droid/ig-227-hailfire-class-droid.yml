  - _id: 1a246050358a36f5
    name: Crushing Stride
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3d-p5-droids
    img: modules/sw5e-module/icons/packs/monsters/179_-_IG-227_Hailfire-Class_Droid/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The droid moves up to its speed in a straight line. During this move, it can enter Large or smaller
          creatures' spaces. A creature whose space the droid enters must make a DC 17 Dexterity saving throw. On a
          successful save, the creature is pushed 5 feet to the nearest space out of the droid's path. On a failed save,
          the creature falls prone and takes 28 (8d6) kinetic damage. If the droid remains in the prone creature's
          space, the creature is also restrained until it's no longer in the same space as the droid. While restrained
          in this way, the creature, or another creature within 5 feet of it, can make a DC 17 Strength check. On a
          success, the creature is shunted to an unoccupied space of its choice within 5 feet of the droid and is no
          longer restrained.</p>
        chat: ""
      requirements: ""
