            max: 10
            runtimeAutomation: true
    img: modules/sw5e-module/icons/packs/monsters/179_-_IG-227_Hailfire-Class_Droid/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The droid launches three missiles at points within 240 feet of it that it can see. Each creature within a
          10-foot radius sphere of each point must make a DC 17 Dexterity saving throw, taking 21 (6d6) fire and 21
          (6d6) kinetic damage on a failed save, or half as much damage on a successful one. A creature in the area of
          more than one sphere is affected only once. Large and larger constructs and structures have disadvantage on
          the saving throw, and suffer an additional 21 (6d6) fire and 21 (6d6) kinetic damage if they fail the save by
          10 or more.</p>
        chat: ""
