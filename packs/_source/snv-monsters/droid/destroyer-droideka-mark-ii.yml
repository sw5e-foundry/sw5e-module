  - _id: 9ef7bf0514052760
    name: Deflector Shield
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3e-p2-droids
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>As a bonus action while in attack form, the droideka can activate its deflector shield. The droideka gains
          +2 AC when the deflector shield is active. The deflector has 120 hit points. Whenever the droideka takes
          damage other than ion or lightning, the shield takes the damage instead. If this damage reduces the shield to
          0 hit points, the droideka takes any remaining damage. The droideka can deactivate the shield (no action
          required). When deactivated the shield regenerates 20 hit points at the end of the droideka's turn. The shield
          shuts down and cannot be activated when in ball form.</p>
        chat: ""
      requirements: ""
