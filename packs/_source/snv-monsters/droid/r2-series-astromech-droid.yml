    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/MinorHologram.webp
    system:
      description:
        value: >-
          <p>This ability is a minor tech trick that creates one of the following effects within range.</p>

          <ul>

          <li>You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint
          musical notes, or an odd odor. </li>

          <li>You instantaneously light or snuff out a source of light. </li>

          <li>You instantaneously clean or soil an object no larger than 1 cubic foot. </li>

          <li>You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour. </li>

          <li>You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour. </li>

          <li>You create a trinket or an illusory image that can fit in your hand and that lasts until the end of your
          next turn. </li>

          </ul>

          <p>If you use this power multiple times, you can have up to three of its non-instantaneous effects active at a
          time, and you can dismiss such an effect as an action.</p>
