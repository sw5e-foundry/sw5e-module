          <p>While a creature is interfaced with the droid via the *tracker droid interface* tech power, when it makes a
          Wisdom (Survival) check to track a target, and the droid is also tracking that target, the interfaced creature
          gains advantage on the check. If it would already have advantage, it can instead reroll one of the dice
          once.</p>
