    system:
      description:
        value: >-
          <p>You touch a droid or construct and upgrade one of its aspects. Choose one of the following effects; the
          target gains that effect until the power ends. </p>

          <ul>

          <li><strong><em>Servomotor.</em></strong> The target has advantage on Strength checks, and its carrying
          capacity doubles. </li>

          <li><strong><em>Motivator.</em></strong> The target has advantage on Dexterity checks. It also doesn't take
          damage from falling 20 feet or less if it isn't incapacitated. </li>

          <li><strong><em>Power Core.</em></strong> The target has advantage on Constitution checks. It also gains [[/r
          2d6]] temporary hit points, which are lost when the power ends. </li>

          <li><strong><em>Databanks.</em></strong> The target has advantage on Intelligence checks. </li>

          <li><strong><em>Sensors.</em></strong> The target has advantage on Wisdom checks. </li>

          <li><strong><em>Relations Protocols.</em></strong> The target has advantage on Charisma checks. </li>

          </ul>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 3rd level or
          higher, you can target one additional droid or construct for each slot level above 2nd.</p>
