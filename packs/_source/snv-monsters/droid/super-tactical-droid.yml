    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/SpectrumBolt.webp
    system:
      description:
        value: >-
          <p>You fire an undulating, warbling bolt of energy at a creature within range. Make a ranged tech attack
          against the target. On a hit, the target takes [[/r 2d8]] + [[/r 1d6]] damage. Choose one of the d8s. The
          number rolled on that die determines the attacks damage type, as shown below.</p>

          <p>| [[/r d8]]  | Damage Type |</p>

          <p>|:---:|:-----------:|</p>

          <p>|  1  | Acid |</p>

          <p>|  2  | Cold |</p>

          <p>|  3  | Fire |</p>

          <p>|  4  | Energy |</p>

          <p>|  5  | Ion |</p>

          <p>|  6  | Lightning |</p>

          <p>|  7  | Poison |</p>

          <p>|  8  | Sonic |</p>

          <p>If you roll the same number on both d8s, the bolt leaps from the target to a different creature of your
          choice within 30 feet of it. Make a new attack roll against the new target, and make a new damage roll, which
          could cause the bolt to leap again. A creature can be targeted only once by each casting of this power.</p>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 2nd level or
          higher, each target takes [[/r 1d6]] extra damage of the type rolled for each slot level above 1st.</p>
