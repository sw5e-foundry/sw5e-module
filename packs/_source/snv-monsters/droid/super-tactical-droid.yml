          activity: []
          effect: []
      core:
        sourceId: Compendium.sw5e-module.powers-maneuvers.Item.eFpWjBbDeGQ7JXcH
      sw5e:
        snvMonsters:
          embeddedFromCanonical: true
          canonicalCastType: tech
          canonicalCompendium: sw5e-module.powers-maneuvers
          canonicalName: Autonomous Servant
          sourceSemanticKey: snv:Droids:super-tactical-droid
          tierLabel: 3rd-level
          tierKind: leveled
          overrides: []
    type: spell
    img: modules/sw5e-module/icons/packs/Tech%20Powers/AutonomousServant.webp
    system:
      description:
        value: >-
          <p>You touch one Tiny, unenhanced object that isn't attached to another object or a surface and isn't being
          carried by another creature. The target animates and gains little arms and legs, becoming a creature under
          your control until the power ends or the creature drops to 0 hit points. See the stat block for its
          statistics. </p>

          <p><em></em>_</p>

          <p>&gt; ## Servant</p>

          <p>&gt;<em>Tiny construct, unaligned</em></p>

          <p>&gt; <em></em>_</p>

          <p>&gt; - <strong>Armor Class</strong> 15 (natural armor)</p>

          <p>&gt; - <strong>Hit Points</strong> 10 ([[/r 4d4]])</p>

          <p>&gt; - <strong>Speed</strong> 30 feet, climb 30 feet</p>

          <p>&gt;<em></em>_</p>

          <p>&gt;|STR|DEX|CON|INT|WIS|CHA|</p>

          <p>&gt;|:---:|:---:|:---:|:---:|:---:|:---:|</p>

          <p>&gt;|4 (-3)|16 (+3)|10 (+0)|2 (-4)|10 (+0)|1 (-5)|</p>

          <p>&gt;<em></em>_</p>

          <p>&gt; - <strong>Damage Vulnerabilities</strong> ion</p>

          <p>&gt; - <strong>Damage Resistances</strong> necrotic, poison, psychic</p>

          <p>&gt; - <strong>Condition Immunities</strong> charmed, deafened, exhaustion, poisoned</p>

          <p>&gt; - <strong>Senses</strong> blindsight 60 feet (blind beyond this radius), passive Perception 10</p>

          <p>&gt; - <strong>Languages</strong> â€"</p>

          <p>&gt; <em></em>_</p>

          <p>&gt; <strong>Circuitry.</strong> The construct has disadvantage on saving throws against effects that would
          deal ion or lightning damage.</p>

          <p>&gt; ### Actions</p>

          <p>&gt; <strong><em>Slam.</em></strong> <em>Melee Weapon Attack:</em> +4 to hit, reach 5 feet, one target.
          <em>Hit</em> 5 ([[/r 1d4 + 3]]) kinetic damage.</p>

          <p>As a bonus action, you can nonverbally command the creature if it is within 120 feet of you. (If you
          control multiple creatures with this power, you can command any or all of them at the same time, issuing the
          same command to each one.) You decide what action the creature will take and where it will move during its
          next turn, or you can issue a simple, general command, such as to fetch a code cylinder, stand watch, or stack
          some small objects. If you issue no commands, the servant does nothing other than defend itself against
          hostile creatures. Once given an order, the servant continues to follow that order until its task is
          complete.</p>

          <p>When the creature drops to 0 hit points, it reverts to its original form, and any remaining damage carries
          over to that form.</p>

          <p>The creature is considered a valid target for the <em>tracker droid interface</em> power.</p>

          <p><strong><em>Overcharge Tech.</em></strong> When you cast this power using a tech slot of 4th level or
          higher, you can animate two additional objects for each slot level above 3rd.</p>
