    name: Techcasting
    type: feat
    img: systems/dnd5e/icons/svg/items/feature.svg
    system:
      description:
        value: >-
          <p>The tactical droid is a 13th-level techcaster. Its techcasting ability is Intelligence (tech save DC 18,
          +10 to hit with tech powers). It has 57 tech points and it knows the following tech powers:<br>At-will:
          *assess the situation, electroshock, encrypted message, poison spray, spectrum ray, tracker droid interface,
          warding shot*<br><br>1st-level: *expeditious retreat, homing rockets, preparedness, repair droid, spectrum
          bolt, voltaic shield*<br><br>2nd-level: *capacity boost, energetic burst, enhance droid, mirror
          image*<br><br>3rd-level: *autonomous servant, destroy tech, explosion, tactical advantage*<br><br>4th-level:
          *radiation, sensor probe, synchronicity, wire bind*<br><br>5th-level: *mass repair droid, toxic
          cloud*<br><br>6th-level: *security protocols*<br><br>7th-level: *tactical superiority*</p>
