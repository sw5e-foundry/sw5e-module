          to hit with tech powers). It has 23 tech points and knows the following tech powers: <br><br>At-will: *assess
          the situation, electroshock, haywire* <br><br>1st-level: *copy, expeditious retreat, stack the deck*
          <br><br>2nd-level: *concealed caltrops, paralyze humanoid* <br><br>3rd-level: *read memory, vertical
