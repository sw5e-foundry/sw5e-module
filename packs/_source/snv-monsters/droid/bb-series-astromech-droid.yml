    system:
      description:
        value: >-
          <p>The droid is a 3rd-level techcaster. Its techcasting ability is Intelligence (tech save DC 13, +5 to hit
          with tech powers). It has 15 tech points and knows the following tech powers: <br>At-will: *jet of flame,
          mending, minor hologram, on/off, wire line* <br><br>1st-Level: *decryption program, expeditious retreat,
          hologram, repair droid, target lock* <br><br>2nd-Level: *motivator boost, pyrotechnics, release*</p>
