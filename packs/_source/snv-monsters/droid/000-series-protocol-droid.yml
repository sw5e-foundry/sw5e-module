    system:
      description:
        value: >-
          <p>The droid is a 5th-level techcaster. Its techcasting ability is Intelligence (tech save DC 13, +5 to hit
          with tech powers). It has 23 tech points and knows the following tech powers: <br><br>At-will: *assess the
          situation, electroshock, venomous strike* <br><br>1st-level: *poison dart, spot the weakness, toxin scan,
          tranquilizer* <br><br>2nd-level: *paralyze humanoid, toxin purge, truth serum* <br><br>3rd-level: *tactical
          advantage*</p>
