  - _id: 5586de50154908e4
    name: Dark Lightning
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: fts-fix-01
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>When the avatar successfully deals lightning damage to a creature, it can activate one of the following
          effects as a bonus action or as a reaction on another creature's turn. The target must make a DC 21
          Constitution saving throw, suffering one of the following effects on a failure *(the effect is of the avatar's
          choice, and it chooses the effect before the target rolls their saving throw)*: **Debilitating Burst:** On a
          failure, the target is blinded and deafened until the end of the avatar's next turn. On a success, the target
          is considered poisoned until the end of its next turn. The avatar must maintain concentration on these
          effects. **Lingering Burst:** On a failure, the target is shocked until the end of the avatar's next turn. On
          a success, the target is shocked until the start of its next turn. **Powerful Burst:** On a failure, the
          target is pushed 10 feet in any direction and knocked prone. On a success, the target is pushed 10 feet in any
          direction.</p>
        chat: ""
