    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +10 to hit, reach 10 ft., one target. *Hit:* 15 (2d8 + 6) kinetic damage. If the
          target is a Medium or smaller creature, it must succeed on a DC 16 Dexterity saving throw or be swallowed by
          the exogorth. A swallowed creature is blinded and restrained, it has total cover against attacks and other
          effects outside the exogorth, and it takes 14 (4d6) acid damage at the start of each of the exogorth's turns.
          If the exogorth takes 30 damage or more on a single turn from a creature inside it, the exogorth must succeed
          on a DC 14 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which
          fall prone in a space within 10 feet of the exogorth. If the exogorth dies, a swallowed creature is no longer
          restrained by it and can escape from the corpse by using 15 feet of movement, exiting prone.</p>
        chat: ""
