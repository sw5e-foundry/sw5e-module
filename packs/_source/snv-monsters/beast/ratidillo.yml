    folder: null
    system:
      description:
        value: >-
          <p>The ratidillo leaps up to 30 feet to an empty space it can see. When it lands, each creature within 5 feet
          of it must succeed on a DC 14 Strength or Dexterity saving throw (target's choice) or be knocked prone and
          take 14 (3d6 + 4) kinetic damage. On a successful save, a creature takes only half the damage, isn't knocked
          prone, and is pushed 5 feet away from the ratidillo to an unoccupied space of the creature's choice. If no
          unoccupied space is within range, the creature instead falls prone.</p>
        chat: ""
