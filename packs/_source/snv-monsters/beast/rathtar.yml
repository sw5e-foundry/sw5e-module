    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +9 to hit, reach 5 ft., one target. *Hit:* 14 (2d8 + 5) kinetic damage, and the
          target is swallowed if it is a medium or smaller creature. A swallowed creature is blinded and restrained, has
          total cover against attacks other effects outside the rathtar, and takes 14 (4d6) acid damage at the start of
          each of the rathtar's turns. The rathtar's gullet can hold up to two Medium or smaller creatures inside it at
          a time. If the rathtar takes 20 damage or more on a single turn from a creature inside it, the rathtar must
          succeed on a DC 18 Constitution saving throw at the end of that turn or regurgitate the swallowed creatures,
          which fall prone in a space within 10 feet of the rathtar. If the rathtar dies, the swallowed creatures are no
          longer restrained by it and can escape from the corpse using 5 feet of movement, exiting prone.</p>
