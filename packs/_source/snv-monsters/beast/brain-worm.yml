  - _id: 7852653af06ca22b
    name: Body Thief
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3d-p3-beasts-1
    img: modules/sw5e-module/icons/packs/monsters/026_-_Brain_Worm/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The brain worm initiates an Intelligence contest with an incapacitated humanoid within 5 feet of it. If it
          wins the contest, the brain worm burrows into the target's brain and takes control of the target's body. While
          inside a creature, the brain worm has total cover against attacks and other effects originating outside its
          host. The brain worm retains its Intelligence, Wisdom, and Charisma scores, as well as its understanding of
          Geonosian, its telepathy, and its traits. It otherwise adopts the target's statistics. It knows everything the
          creature knew, including force powers, tech powers, and languages. If the host body takes 20 points of cold
          damage in a single round, the brain worm must make a DC 15 Constitution saving throw using its own
          Constitution score, not the host's. On a failure, the brain worm leaves the body, slithering out to a space
          within 5 feet of the host. After exiting the host, it is paralyzed until the start of its next turn. If the
          host body dies, the brain worm must leave it. The brain worm is also forced out if the target regains its
          devoured brain by means of a *master heal* force power. By spending 5 feet of its movement, the brain worm can
          voluntarily leave the body, slithering out to the nearest unoccupied space within 5 feet of it.</p>
        chat: ""
      requirements: ""
      source:
        custom: SnV
