      description:
        value: >-
          <p>The brain worm targets one creature it can see within 10 feet of it that has a brain. The target must
          succeed on a DC 12 Intelligence saving throw against this power or take 11 (2d10) psychic damage. Also on a
          failure, roll 3d6: If the total equals or exceeds the target's Intelligence score, that score is reduced to 0.
