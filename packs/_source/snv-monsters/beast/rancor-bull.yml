  - _id: 6bc5c571bfa9dad6
    name: Swallow
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3e-p2-beasts-2
          complexActionLimitation:
            family: swallow-action
            featureName: Swallow
            requiresGrappledTarget: true
            targetSizeMax: Medium
            ongoingAcidFormula: 12d6
            regurgitateDamageThreshold: 35
            regurgitateSaveDc: 25
            runtimeAutomation: false
            limitation: Swallow follow-up attack, containment, ongoing acid, and regurgitation are description-preserved only.
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The rancor makes one bite attack against a Medium or smaller creature it is grappling. If the attack hits,
          the target takes the bite's damage, the target is swallowed, and the grapple ends. While swallowed, the
          creature is blinded and restrained, it has total cover against attacks and other effects outside the rancor,
          and it takes 42 (12d6) acid damage at the start of each of the rancor's turns. If the rancor takes 35 damage
          or more on a single turn from a creature inside it, the rancor must succeed on a DC 25 Constitution saving
          throw at the end of that turn or regurgitate all swallowed creatures, which fall prone in a space within 10
          feet of the rancor. If the rancor dies, a swallowed creature is no longer restrained by it and can escape from
          the corpse by using 10 feet of movement, exiting prone.</p>
        chat: ""
      requirements: ""
