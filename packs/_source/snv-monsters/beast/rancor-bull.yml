    system:
      description:
        value: >-
          <p>Each creature of the rancor's choice within 90 feet of it must succeed a DC 22 Wisdom saving throw or
          become frightened for 1 minute. A creature can repeat the saving throw at the end of each of its turns, with
          disadvantage if the Rancor is within line of sight, ending the effect on itself on a success. If a creature's
          saving throw is successful or the effect ends for it, the creature is immune to the rancor's Frightful Roar
          for the next 24 hours.</p>
