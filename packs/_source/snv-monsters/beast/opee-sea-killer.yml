    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +8 to hit, reach 30 ft., one target at least 10 feet from the sea killer. The target
          is grappled (escape DC 16) if it is a Huge or smaller creature. Until this grapple ends, the target is
          restrained, and the Sea Killer can't use its bite or tongue attacks on another target. The target must make a
          DC 16 Strength saving throw. On a failed save, the target is pulled to a space within 5 feet of the sea
          killer, and the sea killer can immediately use a bonus action to make one bite attack against the target.</p>
