  - _id: 797983b798f7e07d
    name: Transparent Trap
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3e-p2-beasts-2
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The taozin maintains a series of invisible snare-like lines of web. A successful DC 16 Wisdom (Perception)
          check must be made to spot taozin snare lines, and the check is always made with disadvantage unless the
          searcher has some means of overcoming the snares’ invisibility. A creature that enters a space containing
          taozin snare lines must make a successful DC 13 Dexterity saving throw or be restrained by the sticky snares
          (escape DC 18). This saving throw is made with disadvantage if the creature was unaware of the snare lines’
          presence.</p>
        chat: ""
      requirements: ""
