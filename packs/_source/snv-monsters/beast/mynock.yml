      description:
        value: >-
          <p>*Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 5 (1d4 + 3) kinetic damage, and the
          target is grappled (escape DC 13). If the target is a droid or construct, at the start of each of the mynock's
          turns, the target loses 2 (1d4) hit points as its energy is drained, and the mynock gains temporary hit points
          equal to the damage. The grapple automatically ends after the mynock drains at least 10 hit points of energy,
          or the target dies. A creature other than the grappled target can use an action to remove the mynock, ending
          the grapple.</p>
