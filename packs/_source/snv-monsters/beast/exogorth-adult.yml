    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +14 to hit, reach 10 ft., one target. *Hit:* 22 (3d8 + 9) kinetic damage. If the
          target is a Large or smaller creature, it must succeed on a DC 19 Dexterity saving throw or be swallowed by
          the exogorth. A swallowed creature is blinded and restrained, it has total cover against attacks and other
          effects outside the exogorth, and it takes 21 (6d6) acid damage at the start of each of the exogorth's turns.
          If the exogorth takes 30 damage or more on a single turn from a creature inside it, the exogorth must succeed
          on a DC 21 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which
          fall prone in a space within 10 feet of the exogorth. If the exogorth dies, a swallowed creature is no longer
          restrained by it and can escape from the corpse by using 20 feet of movement, exiting prone.</p>
        chat: ""
