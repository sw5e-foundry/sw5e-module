  - _id: a79b9a47e45125e4
    name: Grunge Fever
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3b-p11
    img: modules/sw5e-module/icons/packs/monsters/020_-_Beggar_27s_Canyon_Womp_Rat/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>A creature infected by the rat's Grunge Fever starts to display symptoms after 1d4 days, which include
          fatigue and cramps. The infected creature suffers one level of exhaustion, and it regains only half the normal
          number of hit points from spending hit dice and no hit points from finishing a long rest. At the end of each
          long rest, an infected creature must make a DC 11 Constitution saving throw. On a failed save, the creature
          gains one level of exhaustion. On a successful save, the character’s exhaustion level decreases by one level.
          If a successful saving throw reduces the infected creature’s level of exhaustion below 1, the creature
          recovers from the disease.</p>
        chat: ""
