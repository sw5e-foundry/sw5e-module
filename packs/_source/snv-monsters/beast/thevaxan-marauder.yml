  - _id: 8b6c31312897fb73
    name: Frightening Presence
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3e-p2-beasts-2
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Each creature of the marauder’s choice that is within 120 feet of the marauder and aware of it must succeed
          on a DC 18 Wisdom saving throw or become frightened for 1 minute. A frightened creature repeats the saving
          throw at the end of each of its turns, ending the effect on itself on a success. If a creature’s saving throw
          is successful or the effect ends for it, the creature is immune to the marauder’s Frightful Presence for the
          next 24 hours.</p>
        chat: ""
      requirements: ""
