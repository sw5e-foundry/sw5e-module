  details:
    biography:
      value: "<p>Aiwhas, also called air whales, were a non-sentient species of winged cetaceans native to the planet Kamino. They were used as mounts by the Kaminoans.</p><table class=\"userscript-table userscript-table-bordered\" style=\"width:615.455px\"><tbody><tr><td style=\"line-height:1.42857\"><u>Designation</u></td><td style=\"line-height:1.42857\">Non-sentient</td></tr><tr><td style=\"line-height:1.42857\"><u>Classification</u></td><td style=\"line-height:1.42857\"><p>Cetacean</p></td></tr><tr><td style=\"line-height:1.42857\"><u>Homeworld</u></td><td style=\"line-height:1.42857\">Kamino</td></tr><tr><td style=\"line-height:1.42857\"><u>Habitat</u></td><td style=\"line-height:1.42857\"><p>Ocean</p></td></tr><tr><td style=\"line-height:1.42857\"><u>Diet</u></td><td style=\"line-height:1.42857\">Krill</td></tr></tbody></table><h3>Biology and appearance</h3><blockquote><p>\"That uniform suits you about as well as a hat on an aiwha.\"</p><p style=\"margin-bottom:9px\">- Kan Be to Terex</p></blockquote><p>Massive, winged cetaceans, the aiwha were native to both the oceans and skies of the planet Kamino, capable of both swimming and flying using their wingtips to propel them through either substance. Their long, beak-like mouths featured a baleen used for filtering krill from seawater. The non-sentient species, one of a wide variety of aquatic life on Kamino, was also known as the \"air whale\", and were a peaceful and majestic species. Aiwha gave out bleating cries when dying.</p><p><br /></p><h3>History</h3><blockquote><p>\"We've got to stop meeting like this, my friend.\"Â\_</p><p style=\"margin-bottom:9px\">- Obi-Wan Kenobi, saved by an Aiwha for the second time</p></blockquote><p>When the climate of Kamino changed drastically, leading to planet-wide flooding when the ice caps melted, the native Kaminoans adapted both themselves and some of their fellow creatures to their new environment. The aiwhas were among those who were adapted using the Kaminoans' advanced cloning technologies, and became biological curiosities used as mounts to traverse Kamino's endless ocean. The Kaminoans used aiwhas as mounts, although aiwha-riders traveled beneath the waters during the lashing tempests of the severe electrical storms which raged for much of the planet's year.</p><p>During the Battle of Kamino, Jedi Master Obi-Wan Kenobi hitched a ride on an aiwha while investigating the planet's Separatist attackers, and was rescued twice during the battle by the creatures. During the search for the rogue clone trooper CT-5555 (\"Fives\"), teams rode atop aiwhas to track down the fugitive.</p>"
