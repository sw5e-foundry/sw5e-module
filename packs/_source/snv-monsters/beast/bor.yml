  - _id: a354fd5489cfd6c1
    name: Psychic Link
    type: feat
    sort: 0
    flags:
      sw5e:
        snvMonsters:
          prototype: false
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          prePublication: false
          trackedPack: snv-monsters
          sandboxTemp: false
          approvedBatch: n3e-p2-beasts-1
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The bor can establish a psychic link with any creature that it successfully grapples with its tentacles.
          Until the psychic link ends, the bor can perceive everything the target senses. The target is aware that its
          mind is linked, and the bor can terminate the link at any time (no action required). The target can use an
          action on its turn to attempt to break the psychic link with a DC 18 Intelligence saving throw. On a
          successful save, the target takes 10 (3d6) psychic damage. The psychic link also ends if the target and the
          bor are more than 1 mile apart, with no consequences to the target. The bor can form psychic links with up to
          ten creatures at a time.</p>
        chat: ""
      requirements: ""
