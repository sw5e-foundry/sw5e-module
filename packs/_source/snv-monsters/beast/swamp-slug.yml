            regurgitateDamageThreshold: null
            regurgitateSaveDc: null
            runtimeAutomation: false
            limitation: Swallow follow-up attack, containment, ongoing acid, and regurgitation are description-preserved only.
    img: modules/sw5e-module/icons/packs/monsters/125_-_Swamp_Slug/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The slug makes a bite attack against a Large or smaller target it is grappling. On a hit, the target takes
          the bite's normal damage, is swallowed, and the grapple ends. The swallowed target is blinded and restrained,
          it has total cover against attacks and other effects outside the slug, and it takes 7 (2d6) kinetic damage and
          7 (2d6) acid damage at the start of each of the slug's turns. The slug can have only one target swallowed at a
          time. If the slug dies, a swallowed creature is no longer restrained by it and can escape from the corpse
          using 5 feet of movement, exiting prone.</p>
        chat: ""
      requirements: ""
