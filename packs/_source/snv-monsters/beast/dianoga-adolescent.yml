    folder: null
    system:
      description:
        value: >-
          <p>The dianoga can have up to seven tentacles at a time. Each tentacle can be attacked (AC 15; 5 hit points;
          immunity to poison and psychic damage). Destroying a tentacle deals no damage to the dianoga, which can
          extrude a replacement tentacle on its next turn. A tentacle can also be broken if a creature takes an action
          and succeeds on a DC 12 Strength check against it.</p>
