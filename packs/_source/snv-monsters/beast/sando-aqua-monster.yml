          complexActionLimitation:
            family: swallow-action
            featureName: Swallow
            requiresGrappledTarget: true
            targetSizeMax: Large
            ongoingAcidFormula: 12d6
            regurgitateDamageThreshold: 50
            regurgitateSaveDc: 25
            runtimeAutomation: false
            limitation: Swallow follow-up attack, containment, ongoing acid, and regurgitation are description-preserved only.
    img: modules/sw5e-module/icons/packs/monsters/113_-_Sando_Aqua_Monster/Avatar.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The aqua monster makes one bite attack against a Large or smaller creature it is grappling. If the attack
          hits, the target takes the bite's damage, the target is swallowed, and the grapple ends. While swallowed, the
          creature is blinded and restrained, it has total cover against attacks and other effects outside the aqua
          monster, and it takes 42 (12d6) acid damage at the start of each of the aqua monster's turns. If the aqua
          monster takes 50 damage or more on a single turn from a creature inside it, the aqua monster must succeed on a
          DC 25 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall
          prone in a space within 10 feet of the monster. If the monster dies, a swallowed creature is no longer
          restrained by it and can escape from the corpse by using 30 feet of movement, exiting prone.</p>
        chat: ""
      requirements: ""
