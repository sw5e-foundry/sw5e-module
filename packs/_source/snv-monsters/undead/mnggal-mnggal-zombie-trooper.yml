    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The mnggal-mnggal zombie targets a living creature that it is grappling or is unconscious and attempts to
          infect it with its ooze. The creature must succeed on a DC 12 Constitution saving throw. Unconscious creatures
          make this save with disadvantage. On a failed save, the creature becomes poisoned and takes 5 (1d10) poison
          damage. This damage ignores resistances and immunities. A creature reduced to 0 hit points by this damage is
          killed instantly, and rises the next round as a mnggal-mnggal zombie. Creatures can repeat this saving throw
          at the end of their turn. A creature that has successfully saved is immune to this ability for 24 hours.</p>
