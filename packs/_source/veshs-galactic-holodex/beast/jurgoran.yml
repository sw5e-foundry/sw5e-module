  - _id: 9c42f323899c0d3a
    name: Frightful Presence
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:beast:jurgoran
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>Each creature of the jurgoran's choice that is within 60 feet of the jurgoran and aware of it must succeed
          on a DC 13 Wisdom saving throw or become Frightened for 1 minute. A creature can repeat the saving throw at
          the end of each of its turns, ending the effect on itself on a success. If a creature's saving throw is
          successful or the effect ends for it, the creature is immune to the jurgoran's Frightful Presence for the next
          24 hours.</p>
        chat: ""
