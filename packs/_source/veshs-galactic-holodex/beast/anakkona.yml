  - _id: 625b0533645fe238
    name: Sparkling Scales
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          sourceSemanticKey: vgh:beast:anakkona
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The anakkona’s scales refract light in iridescent cascades that are hypnotic to gaze upon. If the anakkona
          is in bright light, a creature within 30 feet that looks at it must make a successful DC 17 Wisdom saving
          throw or be stunned until the end of its next turn. Unless surprised, a creature can avoid the saving throw by
          choosing to avert its eyes at the start of its turn. A creature that averts its eyes can’t see the anakkona
          until the start of its next turn, when it can choose to avert its eyes again. If the creature looks at the
          anakkona in the meantime, it must immediately make the saving throw.</p>
        chat: ""
      requirements: ""
      source:
        custom: Vesh's Galactic Holodex
