  - _id: 321eb2e0b60b4791
    name: Bite
    type: weapon
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: validated-natural-weapon
          kind: weaponNatural
          sourceActionNames:
            - Bite
          sourceSemanticKey: vgh:beast:anakkona
    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +13 to hit, reach 10 ft., one target. *Hit:* 21 (3d8+8) kinetic damage. If the
          target is a Huge or smaller creature, it must succeed on a DC 18 Dexterity saving throw or be swallowed by the
          anakkona. A swallowed creature is blinded and restrained, has total cover against attacks and other effects
          outside the snake, and takes 21 (6d6) acid damage at the start of each of the anakkona’s turns. If the
          anakkona takes 30 damage or more on a single turn from a creature inside it, the anakkona must succeed on a DC
          15 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall prone
          in a space within 10 feet of the anakkona. If the anakkona dies, a swallowed creature is no longer restrained
          by it and can escape from the corpse by using 20 feet of movement, exiting prone.</p>
        chat: ""
      source:
        custom: Vesh's Galactic Holodex
