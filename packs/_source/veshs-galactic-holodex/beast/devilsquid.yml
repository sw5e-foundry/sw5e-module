    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The devilsquid emits black, venomous ink in a 30-foot cloud as a bonus action while underwater. The cloud
          affects vision as the darkness force power, and any creature that starts its turn inside the cloud takes 10
          (3d6) poison damage, or half damage with a successful DC 18 Constitution saving throw. The devilsquid’s
          darkvision is not impaired by this cloud. The cloud persists for 1 minute, then disperses.</p>
        chat: ""
