  - _id: 1621b1df33950abb
    name: Toxic Sludge (Recharge 5 or 6)
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:beast:slyyyg
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The slyyyg sprays toxic sludge in a 15 foot cone, coating everything in the affected area. The affected
          area is considered difficult terrain and lasts for 1d4 rounds. Creatures in the area and those that start
          their turn in it or enter it for the first time must make a DC 13 Constitution saving throw. On a fail, a
          creature takes 11 (2d10) acid damage and is poisoned for one minute. On a successful saving throw, a creature
          takes half damage and is not poisoned. Poisoned creatures can repeat the saving throw at the end of their next
          turn to end the effect. Once a creature succeeds on the saving throw, they cannot be poisoned in this way
          again for 24 hours.</p>
        chat: ""
      requirements: ""
