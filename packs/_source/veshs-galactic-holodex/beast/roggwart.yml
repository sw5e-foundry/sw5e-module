    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The Roggwart can grapple creatures with its tail, and when it is grappling a creature with its tail, it can
          use a bonus action to slam the target into the ground. The target must succeed on a Strength saving throw (DC
          17) or take 21(6d6) kinetic damage and be knocked prone. On a successful save, the target takes half damage.
          Once it has been slammed in this way, the target is no longer grappled.</p>
