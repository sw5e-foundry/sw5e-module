    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +0 to hit, reach 0 ft., one creature in the swarm's space., one target. *Hit:* The
          target is infested by 1d4 artery worms. At the start of each of the target's turns, the target takes 1d6
          piercing damage per rot grub infesting it. Applying fire to the bite wound before the end of the target's next
          turn deals 1 fire damage to the target and kills these rot grubs. After this time, these artery worms are too
          far under the skin to be burned. If a target infested by artery worms ends its turn with 0 hit points, it dies
          as the artery worms burrow into its heart and kill it. Any effect that cures disease kills all artery worms
          infesting the target.</p>
        chat: ""
