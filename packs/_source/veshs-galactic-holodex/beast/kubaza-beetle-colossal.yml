    system:
      description:
        value: >-
          <p>When the beetle dies, it explodes, and each creature within 30 feet of it must make a DC 16 Dexterity
          saving throw, taking 31 (9d6) acid damage on a failed save, or half as much damage on a successful one. The
          explosion ignites flammable objects in that area that aren't being worn or carried, and it destroys the
          beetle's body.</p>
