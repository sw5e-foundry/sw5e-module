  - _id: af30559725b2dcb0
    name: Bite
    type: weapon
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: validated-natural-weapon
          kind: weaponNatural
          sourceActionNames:
            - Bite
          sourceSemanticKey: vgh:beast:cliffborer-worm-ancient
    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +10 to hit, reach 15 ft., one target. *Hit:* 23 (4d6 + 5) kinetic damage. If the
          target is a Large or smaller creature, it must succeed on a DC 18 Dexterity saving throw or be swallowed by
          the cliffborer worm. A swallowed creature is blinded and restrained, has total cover against attacks and other
          effects outside the worm, and takes 10 (3d6) kinetic damage plus 10 (3d6) acid damage at the start of each of
          the cliffborer worm’s turns. The cliffborer worm can have only one creature swallowed at a time. If the
          cliffborer worm takes 20 damage or more on a single turn from a creature inside it, the cliffborer worm must
          succeed on a DC 15 Constitution saving throw at the end of that turn or regurgitate the swallowed creature,
          which falls prone in a space within 5 feet of the cliffborer worm. If the cliffborer worm dies, a swallowed
          creature is no longer restrained by it and can escape from the corpse by using 10 feet of movement, exiting
          prone.</p>
        chat: ""
      source:
        custom: Vesh's Galactic Holodex
