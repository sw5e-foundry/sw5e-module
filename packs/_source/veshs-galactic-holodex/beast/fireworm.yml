          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:beast:fireworm
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The fireworm exhales fire in a 60-foot cone. Each creature in that area takes 63 (18d6) fire damage, or
          half damage with a successful DC 19 Dexterity saving throw. Each creature in that area must also succeed on a
          DC 18 Wisdom saving throw or go on a rampage for 1 minute. A rampaging creature must attack the nearest living
          creature or smash some object smaller than itself if no creature can be reached with a single move. A
          rampaging creature repeats the saving throw at the end of each of its turns, ending the effect on itself on a
          success.</p>
        chat: ""
      requirements: ""
