    system:
      description:
        value: >-
          <p>When the beetle dies, it explodes, and each creature within 15 feet of it must make a DC 13 Dexterity
          saving throw, taking 10 (3d6) acid damage on a failed save, or half as much damage on a successful one. The
          explosion ignites flammable objects in that area that aren't being worn or carried, and it destroys the
          beetle's body.</p>
