    name: Lay Egg
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          sourceSemanticKey: vgh:beast:iknayid-broodmother
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>As a bonus action, the broodmother can lay an egg that contains an iknayid broodling. The egg appears in
          the nearest space within 5 feet of the broodmother. The egg has an of AC 5 and has 5 hit points. At the end of
          the broodmother's next turn, the iknayid broodling can use a bonus action to break out of its egg and
          immediately move and attack the nearest creature that isn't an iknayid.</p>
        chat: ""
      requirements: ""
