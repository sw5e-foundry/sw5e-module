  - _id: 9345eb64846e2faa
    name: Bite
    type: weapon
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: validated-natural-weapon
          kind: weaponNatural
          sourceActionNames:
            - Bite
          sourceSemanticKey: vgh:beast:klorslug-adult
    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +7 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) kinetic damage plus 17 (5d6)
          poison damage. If the poison damage reduces the target to 0 hit points, the target is stable but poisoned for
          1 hour, even after regaining hit points, and is paralyzed while poisoned in this way. Additonally, If the
          target is a Medium or smaller creature, it must succeed on a DC 15 Dexterity saving throw or be swallowed by
          the k'lor'slug. A swallowed creature is blinded and restrained, has total cover against attacks and other
          effects outside the k'lor'slug, and takes 7 (2d6) kinetic damage plus 7 (2d6) acid damage at the start of each
          of the k'lor'slug’s turns. The k'lor'slug can have only one creature swallowed at a time. If the k'lor'slug
          takes 20 damage or more on a single turn from a creature inside it, the k'lor'slug must succeed on a DC 15
          Constitution saving throw at the end of that turn or regurgitate the swallowed creature, which falls prone in
          a space within 5 feet of the k'lor'slug. If the k'lor'slug dies, a swallowed creature is no longer restrained
          by it and can escape from the corpse by using 10 feet of movement, exiting prone.</p>
        chat: ""
      source:
        custom: Vesh's Galactic Holodex
