  - _id: 748d493962b75bc6
    name: Crushing Pin
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:beast:kintan-crusher-behemoth
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The kintan crusher stomps the target, pinning it to the ground, where it is grappled and restrained (escape
          DC 19). The kintan crusher is free to attack another target, but the restrained creatures are released if it
          moves from its current space. As long as the crusher does not move from the spot, it can maintain the crushing
          pin on up to two Medium-sized or smaller creatures. A creature suffers 11 (1d8+7) kinetic damage every time it
          starts its turn restrained by a crushing pin.</p>
        chat: ""
      requirements: ""
      source:
        custom: Vesh's Galactic Holodex
