  - _id: 0204bdc588201e1c
    name: Groundquake (Recharge 6)
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:beast:kintan-crusher-behemoth
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The kintan crusher slams the ground, causing a seismic disturbance in a 20-foot radius of itself. Each
          creature on the ground that is concentrating must make a Constitution saving throw. On a failed save, the
          creature’s concentration is broken. Creatures in the area must make a DC 16 Dexterity saving throw or take 14
          (4d6) kinetic damage and fall prone. On a success a creature takes half damage and doesn't fall prone.
          Creatures affected by the kintan crusher's crushing pin automatically fail their saving throws.</p>
        chat: ""
      requirements: ""
