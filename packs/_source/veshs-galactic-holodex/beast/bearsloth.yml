      description:
        value: >-
          <p>Creatures that are poisoned by the bearsloth's venom suffer the normal effects of being poisoned.
          Additionally, at the start of each of the creature's turns, the creature suffers 1d6 poison damage and takes
          one level of exhaustion, and then can repeat the saving throw against the poison. On a success, the effect
          ends. The creature loses one level of exhaustion after completing a long rest.</p>
