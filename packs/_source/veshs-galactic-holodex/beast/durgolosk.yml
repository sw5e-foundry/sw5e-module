          is a creature, it is grappled (escape DC 17) and must make a DC 16 Constitution saving throw. On a failure,
          the creature takes 14 (4d6) poison damage and is paralyzed for 1 minute. A paralyzed creature can repeat the
          saving throw at the end of its turn to end the effect. A creature that succeeds on the saving throw takes half
          damage and is immune to the Durgolosk's venom for 24 hours.</p>
