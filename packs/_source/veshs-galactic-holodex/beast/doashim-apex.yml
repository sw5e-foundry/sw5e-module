      description:
        value: >-
          <p>Each creature of the doashim’s choice that is within 60 feet of the doashim and aware of it must succeed on
          a DC 20 Wisdom saving throw or become Frightened for 1 minute. A creature can repeat the saving throw at the
          end of each of its turns, ending the effect on itself on a success. If a creature’s saving throw is successful
          or the effect ends for it, the creature is immune to the doashim’s Frightful Presence for the next 24
          hours.</p>
