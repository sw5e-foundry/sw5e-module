items:
  - _id: 9a6ae4b0fa3e6a3a
    name: Fight or Flight
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          sourceSemanticKey: vgh:beast:doashim-apex
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>When the doashim is reduced to one quarter of its hit point maximum or fewer (57), roll a d6. On a roll of
          1-3, the doashim attempts to retreat at the start of its next turn, returning only after regenerating back to
          at least half its hit point maximum (114). While retreating in this way, on its turn it uses all its movement
          and the dash action to move as far away as possible. If it has nowhere to run, it takes the dodge action. On a
          roll of 4-6, the doashim becomes enraged until it is killed or no hostile creatures remain in sight. While
          enraged in this way, the doashim gains the following benefits: It has advantage on Strength checks and
          Strength saving throws, it's melee attacks deal an additional damage die of damage, and it gains resistance to
          kinetic and energy damage.</p>
        chat: ""
      requirements: ""
      source:
        custom: Vesh's Galactic Holodex
