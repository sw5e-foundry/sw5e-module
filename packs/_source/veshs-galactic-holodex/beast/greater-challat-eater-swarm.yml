    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +6 to hit, reach 0 ft., every target in its space, one target. *Hit:* 24 (6d6 + 3)
          kinetic damage, or 13 (3d6 + 3) kinetic damage if the swarm has half of its hit points or fewer. The target
          must make a DC 15 Constitution saving throw or take 5d6 poison damage and become poisoned for 1d4 rounds. On a
          successful saving throw, the target takes half damage and is not poisoned.</p>
