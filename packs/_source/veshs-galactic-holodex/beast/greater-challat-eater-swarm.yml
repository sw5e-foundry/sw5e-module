    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>A creature in a space occupied by the challat eater swarm has its speed reduced by half, and must succeed
          on a DC 16 Dexterity saving throw or become blinded. Both effects end when the creature doesn't share a space
          with the swarm at the end of the creature's turn. If a creature succeeds on its saving throw, it is immune to
          the swarm's blindness (but not the speed reduction) for 24 hours.</p>
        chat: ""
      requirements: ""
