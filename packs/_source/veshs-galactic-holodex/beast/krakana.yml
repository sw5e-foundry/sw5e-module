  - _id: 45fcb573496e832c
    name: Bite
    type: weapon
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: validated-natural-weapon
          kind: weaponNatural
          sourceActionNames:
            - Bite
          sourceSemanticKey: vgh:beast:krakana
    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +17 to hit, reach 5 ft., one target. *Hit:* 23 (3d8+10) kinetic damage. If the
          target is a Large or smaller creature grappled by the krakana, that creature is swallowed, and the grapple
          ends. While swallowed, the creature is blinded and restrained, it has total cover against attacks and other
          effects outside the krakana, and it takes 42 (12d6) acid damage at the start of each of the krakana's turns.
          If the krakana takes 50 damage or more on a single turn from a creature inside it, the krakana must succeed on
          a DC 25 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, which fall
          prone in a space within 10 feet of the krakana. If the krakana dies, a swallowed creature is no longer
          restrained by it and can escape from the corpse using 15 feet of movement, exiting prone.</p>
        chat: ""
      source:
        custom: Vesh's Galactic Holodex
