  - _id: 43eaed618a8c09a8
    name: Fling
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:beast:krakana
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>One Large or smaller object held or creature grappled by the krakana is thrown up to 60 feet in a random
          direction and knocked prone. If a thrown target strikes a solid surface, the target takes 3 (1d6) kinetic
          damage for every 10 feet it was thrown. If the target is thrown at another creature, that creature must
          succeed on a DC 18 Dexterity saving throw or take the same damage and be knocked prone.</p>
        chat: ""
