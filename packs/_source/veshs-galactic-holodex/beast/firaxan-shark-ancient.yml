  - _id: 2d0955f8245b721c
    name: Bite
    type: weapon
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: validated-natural-weapon
          kind: weaponNatural
          sourceActionNames:
            - Bite
          sourceSemanticKey: vgh:beast:firaxan-shark-ancient
    img: modules/sw5e-module/icons/packs/Naturals/Teeth.webp
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>*Melee Weapon Attack:* +14 to hit, reach 10 ft., one target. *Hit:* 30 (4d10+8) kinetic damage. If the
          target is a Huge or smaller creature, it must succeed on a DC 18 Dexterity saving throw or be swallowed by the
          shark. A swallowed creature is blinded and restrained, has total cover against attacks and other effects
          outside the shark, and takes 10 (3d6) kinetic damage and 10 (3d6) acid damage at the start of each of the
          shark’s turns. If the shark takes 30 damage or more on a single turn from a creature inside it, the shark must
          succeed on a DC 15 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures,
          which fall prone in a space within 10 feet of the titanoboa. If the shark dies, a swallowed creature is no
          longer restrained by it and can escape from the corpse by using 20 feet of movement, exiting prone.</p>
        chat: ""
      source:
        custom: Vesh's Galactic Holodex
