  - _id: a363fbb07ab87dcc
    name: Fierce Swipe (Recharge 5 or 6)
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:beast:vixian-mauler
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The mauler swipes with its claw with force-enhanced power, affecting a 30-foot cone. Each creature in the
          area that can cast force powers must make a DC 18 Wisdom or Charisma saving throw (their choice) or be
          silenced until the end of the mauler's next turn. A silenced creature is unable to cast force powers, and any
          attempt results in the power failing. Additionally, creatures within 10 feet of the mauler must make a DC 18
          Dexterity saving throw or take 16 (2d8+7) kinetic damage.</p>
        chat: ""
      requirements: ""
