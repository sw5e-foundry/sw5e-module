  - _id: 124f35ff5dae2db5
    name: Ion Cloud (Recharge 6)
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:droid:r8-series-artillery-droid
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The R8 Droid emits a wave a ionic residue centered around itself in a 15-foot radius that moves with it.
          The cloud lasts for 1 minute or until a wind of moderate speed or greater (10 miles per hour) disperses it.
          For its duration, the area is difficult terrain for creatures other than the R8 Droid, and ranged weapon
          attacks made by creatures other than the R8 Droid that deal kinetic, energy, or ion damage and pass through
          the cloud are made with disadvantage. A creature that enters the cloud for the first time on its turn or
          starts its turn there must succeed on a DC 16 Strength saving throw or have its movement speed reduced to 0
          until the start of its next turn.</p>
        chat: ""
      requirements: ""
