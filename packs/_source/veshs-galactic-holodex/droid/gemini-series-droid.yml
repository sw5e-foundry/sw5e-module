          becomes wreathed in an ionic discharge. If the target willingly takes a reaction before the start of your next
          turn, it immediately takes [[/r 1d6]] ion damage, and the power ends. </p>

          <p>This power's damage increases when you reach higher levels. At 5th level, the melee attack deals an extra
          [[/r 1d6]] ion damage to the target, and the damage the target takes for taking reactions increases to [[/r
          2d6]]. Both damage rolls increase by [[/r 1d6]] at 11th level and 17th level.</p>
