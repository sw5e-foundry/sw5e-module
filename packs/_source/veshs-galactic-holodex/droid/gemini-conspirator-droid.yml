  - _id: 36243bb5bda1573a
    name: Memory Override
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          sourceSemanticKey: vgh:droid:gemini-conspirator-droid
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>If the GEMINI droid is reduced to 0 hit points it can attempt to transfer its consciousness to a nearby
          computer or droid. If the target is a non-GEMINI series droid within 60 feet of it, the target must succeed on
          an Intelligence saving throw against the GEMINI droid's Tech save DC or have its body controlled by the GEMINI
          droid. If the target is conscious, it makes this saving throw with advantage. On a failure, the GEMINI droid
          assumes control of the body and the host's consciousness is aware but unable to control its body. At the end
          of 24 hours, it can repeat the saving throw one more time. On a failure, it is erased permanently. While in
          control of the host body, the original GEMINI droid's body is inert and cannot be awoken. The GEMINI assumes
          the statistics of the host body, but retains its Intelligence, Wisdom, and Charisma scores. It retains its
          alignment and features. If the host body has any class levels, it cannot use those features. If the target is
          another GEMINI droid or computer system, the saving throw is made at disadvantage. On a successful saving
          throw or if there is no other droid or computer to upload its memory too, the GEMINI droid dies.</p>
        chat: ""
      requirements: ""
