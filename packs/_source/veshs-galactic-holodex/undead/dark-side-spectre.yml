    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Force Disarm</em></p>

          <p>You select a light- or vibro-weapon within this power's range that is not worn or carried by a conscious
          creature other than you, and use the Force to cause it to levitate, acting as an extension of your will for
          the duration or until you cast this power again. When you use this power, you can cause the weapon to move up
          to 20 feet and make a melee force attack against a creature within 5 feet of it. On a hit, the target takes
          [[/r 1d8]] + your forcecasting ability modifier damage. The type is of the normal damage dealt by the
          weapon.</p>

          <p>While the weapon is animated, on each of your turns you can use a bonus action to move the weapon up to 20
          feet and repeat the attack against a creature within 5 feet of it. At any time, you can end this force power
          to return the animated weapon to your hand.</p>

          <p>An enemy can attempt to gain control of the weapon by using its action to make a Strength (Athletics) check
          against your force save DC. On a success, the creature gains control of the weapon and the power ends.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 3rd level or
          higher, the weapon's damage increases by [[/r 1d8]] for every two slot levels above 2nd.</p>
