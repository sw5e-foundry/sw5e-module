  - _id: 30d05447ddee0d4d
    name: Posession
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featAction
          sourceSection: actions
          sourceSemanticKey: vgh:undead:sith-phantasm
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>One humanoid that the phantasm can see within 5 ft. of it must succeed on a DC 13 Charisma saving throw or
          be possessed by the phantasm; the phantasm then disappears, and the target is incapacitated and loses control
          of its body. The phantasm now controls the body but doesn't deprive the target of awareness. The phantasm
          can't be targeted by any attack, power, or other effect, and it retains its alignment, Intelligence, Wisdom,
          Charisma, and immunity to being charmed and frightened. It otherwise uses the possessed target's statistics,
          but doesn't gain access to the target's knowledge, class features, or proficiencies. The possession lasts
          until the body drops to 0 hit points, the phantasm ends it as a bonus action, or the phantasm is forced out by
          an effect like the improved restoration force power. When the possession ends, the phantasm reappears in an
          unoccupied space within 5 ft. of the body. The target is immune to this phantasm's Possession for 24 hours
          after succeeding on the saving throw or after the possession ends.</p>
        chat: ""
      requirements: ""
      source:
        custom: Vesh's Galactic Holodex
