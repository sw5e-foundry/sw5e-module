    system:
      description:
        value: >-
          <p>The Emperor's Wrath is an 10th-level forcecaster. Its forcecasting ability is Charisma (power save DC 17,
          +9 to hit with force attacks) and it has 44 force points. The Emperor's Wrath knows the following force
          powers:<br>*At-will:* affect mind, force disarm, force push/pull, mind trick, saber reflect, saber throw,
          saber ward<br><br><br>*1st-level:* burse of speed, disperse force, fear, force jump, force
          propel<br><br><br>*2nd-level:* battle meditation, force throw, rescue, stun<br><br><br>*3rd-level:* choke,
          force repulse, force scream, knight speed, sever force<br><br><br>*4th-level:* dominate beast, force immunity,
          freedom of movement<br><br><br>*5th-level:* dominate mind, improved force scream, telekinesis</p>
