          <p>You attempt to beguile a humanoid that you can see within range. It must succeed on a Wisdom saving throw
          or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has
          advantage on the saving throw.</p>

          <p>While the target is charmed, you have a telepathic link with it as long as you are within 1 mile of it. You
          can use this telepathic link to issue commands to the creature while you are conscious (no action required),
          which it does its best to obey. You can specify a simple and general course of action, such as "Attack that
