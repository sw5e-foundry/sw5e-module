      description:
        value: >-
          <p>Choose one creature you can see and one damage type: acid, cold, fire, lightning, or sonic. The target must
          make a Constitution saving throw. If it fails, the first time on each turn when it takes damage of the chosen
          type, it takes an extra [[/r 2d6]] damage of it. The target also loses resistance to the type until the power
          ends.</p>

          <p><strong><em>Overcharge Tech.</em></strong> You can target one additional creature for each slot level above
          4th. The creatures must be within 30 feet of each other when you target them.</p>
