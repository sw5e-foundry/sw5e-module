    system:
      description:
        value: >-
          <p><em><strong>Prerequisite</strong>: Force Lightning</em></p>

          <p>You create a bolt of lightning that arcs toward a target of your choice that you can see within range.
          Three bolts then leap from that target to as many as three other targets, each of which must be within 30 feet
          of the first target. A target can be a creature or an object and can be targeted by only one of the bolts.</p>

          <p>A target must make a Dexterity saving throw. The target takes [[/r 10d8]] lightning damage on a failed
          save, or half as much damage on a successful one.</p>

          <p><strong><em>Force Potency.</em></strong> When you cast this power using a force slot of 7th level or
          higher, one additional bolt leaps from the first target to another target for each slot level above 6th.</p>
