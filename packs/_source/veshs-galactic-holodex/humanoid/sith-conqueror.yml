    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The Sith Conqueror wreathes himself in a whirling barrier of force and lightning energy that extends out in
          a 15 foot radius from him. For the duration, the area within the maelstrom is considered difficult terrain.
          Creatures that start their turn in the maelstrom or enter it for the first time must make a DC 21 Dexterity
          saving throw. On a failed save, a creature takes 13 (3d8) lightning damage and 13 (3d8) force damage. On a
          succesful save, a creatures takes half as much damage. The maelstrom lasts for one minute, until it is ended
          by the Conqueror as a bonus action, or if he is incapacitated or loses concentration.</p>
