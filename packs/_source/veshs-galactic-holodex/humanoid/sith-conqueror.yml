        value: >-
          <p>Sith Conqueror is a 17th-level forcecaster. his forcecasting ability is Charisma (force save DC 21, +13 to
          hit with force attacks, 57 force points).<br>The Sith Conqueror knows the following force powers:<br>*At-will:
          affect mind, denounce, force disarm, force push/pull, saber throw, saber reflect, shock*<br><br><br>*1st
          level: burst of speed, force jump, sap vitality, sense force*<br><br><br>*2nd level: drain vitality, force
          sight, force throw*<br><br><br>*3rd level: choke, force lightning, force repulse, force scream, knight
          speed*<br><br><br>*4th level: drain life, shroud of darkness*<br><br><br>*5th level: dominate mind, improved
          force scream, telekinesis*<br><br><br>*6th level: crush, force chain lightning*<br><br><br>*7th level: force
          lightning cone, master speed*<br><br><br>*8th level: master force scream, telekinetic wave*</p>
