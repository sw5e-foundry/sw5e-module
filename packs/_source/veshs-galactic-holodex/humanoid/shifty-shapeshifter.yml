    system:
      description:
        value: >-
          <p>The clawdite can use its action to shapeshift into a Small or Medium humanoid it has seen, or back into its
          true form. Its statistics, other than its size, are the same in each form. Any equipment it is wearing or
          carrying isn't transformed. It reverts to its true form if it dies. While in this form, the clawdite has
          advantage on deception checks made to maintain its disguise.</p>
