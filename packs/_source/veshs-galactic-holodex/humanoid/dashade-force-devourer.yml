    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The Dashade attempts to devour the force energy of a creature it can see within 60 feet. The creature must
          succeed on a DC 15 Charisma saving throw or take 36 (8d8) necrotic damage. If the save fails by 5 or more, the
          target also ages 1d4 x 10 years. A creature that possess the ability to cast force powers makes this save at
          disadvantage. On a success, a creature takes half damage. The aging effect can be reversed with an Improved
          Restoration power, but only within 24 hours of it occurring.</p>
        chat: ""
      requirements: ""
