      description:
        value: >-
          <p>You create a 20-foot-radius sphere of poisonous, yellow-green fog centered on a point you choose within
          range. The fog spreads around corners. It lasts for the duration or until strong wind disperses the fog,
          ending the power. Its area is heavily obscured.</p>

