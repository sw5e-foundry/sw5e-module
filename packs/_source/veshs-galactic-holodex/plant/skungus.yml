  - _id: 14a38a5c6e531a08
    name: Reflective Shell
    type: feat
    sort: 0
    flags:
      sw5e:
        veshsGalacticHolodex:
          embeddedFromSource: true
          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          sourceSemanticKey: vgh:plant:skungus
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>When a creature makes a ranged weapon attack against the skungus and the attack would deal 4 points of
          damage or fewer, it is reflected back at the attacker. The skungus makes a ranged weapon attack (+3 to hit)
          against the creature, dealing damage equal to the amount the skungus would have taken. The damage type is the
          same as the triggering attack.</p>
        chat: ""
      requirements: ""
