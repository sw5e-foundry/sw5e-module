    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>When a creature comes within 5 feet of the skungus, it can enlarge itself in defense. When it does so, it
          becomes large in size. Creatures within 5 feet of it when it enlarges must make a DC 12 Dexterity saving throw
          or take 2 (1d4) kinetic damage and be pushed 5 feet away from the plant. On a success it takes no damage but
          is still pushed.</p>
