    folder: null
    system:
      description:
        value: >-
          <p>The skungus explodes in a burst of acid and thorns in a 20 foot radius. Every creature in the area must
          succeed on a DC 12 Dexterity saving throw or take 13 (3d8) kinetic damage and 14 (4d6) acid damage. The
          affected area is considered difficult terrain for 1 minute and is coated in acid. Creatures that start their
          turn in the area or enter it for the first time time 1d6 acid damage.</p>
