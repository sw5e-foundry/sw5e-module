          classification: non-weapon
          kind: featPassiveOrRider
          sourceSection: traits
          sourceSemanticKey: vgh:plant:saava
    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The saava can have up to three vines at a time. Each vine can be attacked (AC 10; 10 hit points; immunity
          to psychic and poison damage). A vine can also be broken if a creature takes an action and succeeds on a DC 12
          Strength check against it. Destroying a vine in either way deals no damage to the saava, which can extrude a
          replacement vine on its next turn. The saava can do this a number of times equal to it's constitution modifier
          per day. Vines can extend up to 60 feet from the saava and have a movement speed of 20 ft., climb 20 ft.</p>
        chat: ""
      requirements: ""
      source:
        custom: Vesh's Galactic Holodex
