    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>When a creature tries to enter a space adjacent to a menagerie dragon, the dragon can use a reaction to
          prevent the move by flaring its many scales and spikes. The creature cannot enter a space adjacent to the
          dragon unless it makes a successful DC 18 Dexterity saving throw. If the saving throw fails, the creature can
          keep moving but only into spaces that aren’t within 5 feet of the dragon and takes 10 (3d6) kinetic damage
          from spikes.</p>
        chat: ""
      requirements: ""
