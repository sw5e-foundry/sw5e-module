    img: systems/dnd5e/icons/svg/actors/npc.svg
    effects: []
    folder: null
    system:
      description:
        value: >-
          <p>The dragon carries a compact harness on its back. Up to four medium creatures can ride in the harness
          without squeezing. To make a melee attack against a target within 5 feet of the dragon, they must use
          vibrostaves or weapons with reach. Creatures in the harness have half-cover against attacks and effects from
          outside it. If the dragon dies, creatures in the harness are placed in unoccupied spaces within 5 feet of the
          dragon.</p>
        chat: ""
