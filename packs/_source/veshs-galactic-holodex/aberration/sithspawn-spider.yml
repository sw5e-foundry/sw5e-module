        value: >-
          <p>As a bonus action, the sithspawn spider becomes invisible and intangible. Attacking doesn’t end this
          invisibility. While invisible, the sithspawn spider has advantage on Dexterity (Stealth) checks and gains the
          following: *Damage Resistances:* acid, cold, fire, lightning, sonic; kinetic and energy damage from unenhanced
          attacks *Condition Immunities:* paralyzed, petrified, prone, restrained, stunned The phasewalk ends when the
          spider chooses to end it as a bonus action or when the spider dies.</p>
